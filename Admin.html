<style>
  #mainScreen { margin: 0 !important; padding: 0 !important; position: fixed; top: 0; left: 0; right: 0; bottom: 0; }
  
  .glass-panel {
    background: rgba(255, 255, 255, 0.75);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.3);
    border-radius: 16px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.06);
  }
  
  .glass-header {
    background: linear-gradient(135deg, rgba(128, 0, 0, 0.95) 0%, rgba(160, 20, 20, 0.9) 50%, rgba(128, 0, 0, 0.95) 100%);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid rgba(255, 255, 255, 0.15);
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.2);
  }
  
  .glass-card {
    background: rgba(255, 255, 255, 0.6);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.4);
    border-radius: 12px;
  }
  
  .glass-detail {
    background: rgba(253, 246, 227, 0.75);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(232, 220, 200, 0.4);
    border-radius: 16px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.06);
  }
  
  .filter-btn { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; background: transparent; border: 1px solid #d0d0d0; border-radius: 6px; cursor: pointer; color: #777; font-size: 10px; padding: 0; }
  .filter-btn:hover { background: rgba(128, 0, 0, 0.08); border-color: #800000; color: #800000; }
  .filter-btn.active { background: #800000; border-color: #800000; color: white; }
  
  .dropdown-content { display: none; position: fixed; background: white; border-radius: 12px; box-shadow: 0 12px 40px rgba(0,0,0,0.15); z-index: 9999; min-width: 200px; max-height: 320px; overflow: hidden; }
  
  .toast { position: fixed; top: 20px; right: 20px; padding: 14px 20px; border-radius: 12px; color: white; font-size: 13px; z-index: 9999; box-shadow: 0 8px 32px rgba(0,0,0,0.2); display: none; }
  .toast.success { background: rgba(46, 125, 50, 0.9); }
  .toast.error { background: rgba(211, 47, 47, 0.9); }
  .toast.warning { background: rgba(230, 126, 34, 0.9); }
  @keyframes slideIn { from { opacity: 0; transform: translateX(100px); } to { opacity: 1; transform: translateX(0); } }
  
  .confirm-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: 10000; justify-content: center; align-items: center; }
  .confirm-box { background: white; border-radius: 16px; padding: 28px; width: 380px; max-width: 90vw; box-shadow: 0 20px 60px rgba(0,0,0,0.2); text-align: center; }
  .confirm-box h3 { color: #800000; margin: 0 0 8px; font-size: 16px; }
  .confirm-box .btn-row { display: flex; gap: 10px; justify-content: center; }
  .confirm-box .btn-cancel { padding: 8px 20px; background: #f0f0f0; color: #555; border: 1px solid #ddd; border-radius: 8px; cursor: pointer; font-size: 13px; }
  .confirm-box .btn-confirm { padding: 8px 20px; border: none; border-radius: 8px; cursor: pointer; font-size: 13px; color: white; }
  
  * { font-family: 'Segoe UI', Roboto, -apple-system, sans-serif; }
  
  .table-wrapper { overflow-y: auto; overflow-x: visible; flex: 1; position: relative; }
</style>

<div class="glass-header" style="color:white;padding:10px 20px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;">
  <div>
    <div style="font-size:17px;font-weight:700;">Explora Leads Portal</div>
    <div style="font-size:9px;opacity:0.6;">Powered by Dan Brent Uy</div>
  </div>
  <div style="font-size:11px;opacity:0.85;" id="currentDate"></div>
</div>

<div class="glass-panel" style="padding:12px 28px;display:flex;align-items:center;gap:16px;flex-shrink:0;margin:0 28px;">
  <div id="avatar" style="width:42px;height:42px;background:#800000;border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;font-weight:600;font-size:15px;">--</div>
  <div style="flex:1;"><div id="userName" style="font-size:14px;font-weight:600;color:#1a1a1a;">Loading...</div><div id="userEmail" style="font-size:11px;color:#777;"></div></div>
  <div style="display:flex;gap:8px;">
    <div class="glass-card" style="padding:8px 14px;text-align:center;min-width:60px;"><div id="totalCount" style="font-size:20px;font-weight:700;color:#800000;">0</div><div style="font-size:9px;color:#888;">Total</div></div>
    <div id="pipeCard" onclick="filterByStatus('Pipe')" class="glass-card" style="padding:8px 14px;text-align:center;cursor:pointer;min-width:60px;"><div id="pipeCount" style="font-size:20px;font-weight:700;color:#e67e22;">0</div><div style="font-size:9px;color:#888;">Pipe</div></div>
    <div id="soldCard" onclick="filterByStatus('Sold')" class="glass-card" style="padding:8px 14px;text-align:center;cursor:pointer;min-width:60px;"><div id="soldCount" style="font-size:20px;font-weight:700;color:#2e7d32;">0</div><div style="font-size:9px;color:#888;">Sold</div></div>
  </div>
  <button onclick="handleLogout()" style="background:transparent;border:1px solid #d0d0d0;color:#555;padding:7px 14px;border-radius:6px;cursor:pointer;font-size:11px;">Logout</button>
</div>

<div style="display:flex;flex:1;margin:16px 28px 28px;gap:16px;overflow:hidden;min-height:0;">
  <div class="glass-panel" style="flex:2;overflow:hidden;padding:0;display:flex;flex-direction:column;">
    <div style="padding:12px 20px;border-bottom:1px solid rgba(0,0,0,0.06);display:flex;align-items:center;gap:10px;">
      <input type="text" id="searchInput" placeholder="Search..." oninput="filterTable()" style="flex:1;padding:8px 12px;border:1.5px solid #e0e0e0;border-radius:8px;font-size:13px;outline:none;">
      <button onclick="filterTable()" style="padding:8px 16px;background:#800000;color:white;border:none;border-radius:8px;cursor:pointer;font-size:12px;">Search</button>
      <span id="entryCount" style="font-size:11px;color:#888;white-space:nowrap;"></span>
    </div>
    <div class="table-wrapper">
      <table style="width:100%;border-collapse:collapse;font-size:13px;">
        <thead><tr style="position:sticky;top:0;z-index:2;background:#f8f9fb;">
          <th style="padding:9px 12px;font-weight:600;color:#555;border-bottom:2px solid #e8e8ec;font-size:12px;"><div style="display:flex;align-items:center;justify-content:center;gap:6px;">Author<button class="filter-btn" onclick="return toggleFilterDropdown(event,'author')">▼</button></div><div id="filterDropdown-author" class="dropdown-content"><div style="padding:8px;"><input type="text" class="filter-search-input" placeholder="Search..." oninput="filterDropdownOptions(this,'author')" style="width:100%;padding:6px;border:1px solid #e0e0e0;border-radius:4px;font-size:12px;box-sizing:border-box;"></div><div class="filter-options-list" style="max-height:180px;overflow-y:auto;"></div></div></th>
          <th style="padding:9px 12px;font-weight:600;color:#555;border-bottom:2px solid #e8e8ec;font-size:12px;"><div style="display:flex;align-items:center;justify-content:center;gap:6px;">Book<button class="filter-btn" onclick="return toggleFilterDropdown(event,'book')">▼</button></div><div id="filterDropdown-book" class="dropdown-content"><div style="padding:8px;"><input type="text" class="filter-search-input" placeholder="Search..." oninput="filterDropdownOptions(this,'book')" style="width:100%;padding:6px;border:1px solid #e0e0e0;border-radius:4px;font-size:12px;box-sizing:border-box;"></div><div class="filter-options-list" style="max-height:180px;overflow-y:auto;"></div></div></th>
          <th style="padding:9px 12px;font-weight:600;color:#555;border-bottom:2px solid #e8e8ec;font-size:12px;">ISBN</th>
          <th style="padding:9px 12px;font-weight:600;color:#555;border-bottom:2px solid #e8e8ec;font-size:12px;">Agent</th>
          <th style="padding:9px 12px;font-weight:600;color:#555;border-bottom:2px solid #e8e8ec;font-size:12px;"><div style="display:flex;align-items:center;justify-content:center;gap:6px;">Status<button class="filter-btn" onclick="return toggleFilterDropdown(event,'status')">▼</button></div><div id="filterDropdown-status" class="dropdown-content"><div style="padding:8px;"><input type="text" class="filter-search-input" placeholder="Search..." oninput="filterDropdownOptions(this,'status')" style="width:100%;padding:6px;border:1px solid #e0e0e0;border-radius:4px;font-size:12px;box-sizing:border-box;"></div><div class="filter-options-list" style="max-height:180px;overflow-y:auto;"></div></div></th>
        </tr></thead>
        <tbody id="entriesTableBody"><tr><td colspan="5" style="padding:60px;text-align:center;color:#aaa;">Loading entries...</td></tr></tbody>
      </table>
    </div>
  </div>
  
  <div class="glass-detail" style="flex:1;padding:0;overflow-y:auto;display:flex;flex-direction:column;">
    <div id="detailEmpty" style="padding:24px;text-align:center;margin-top:80px;"><div style="color:#bbb;font-size:13px;">Select an entry to view details</div></div>
    <div id="detailContent" style="display:none;flex-direction:column;flex:1;">
      <div style="padding:14px 18px;border-bottom:1px solid rgba(232,220,200,0.4);display:flex;justify-content:space-between;align-items:center;">
        <div style="font-size:13px;font-weight:600;color:#5d4e37;">Entry Details</div>
        <div style="display:flex;gap:8px;align-items:center;">
          <button onclick="toggleEditMode()" id="editBtn" style="padding:5px 12px;background:#2c5f2d;color:white;border:none;border-radius:4px;cursor:pointer;font-size:11px;">Edit</button>
          <button onclick="saveEntryEdits()" id="saveEditBtn" style="padding:5px 12px;background:#800000;color:white;border:none;border-radius:4px;cursor:pointer;font-size:11px;display:none;">Save</button>
          <button onclick="cancelEdit()" id="cancelEditBtn" style="padding:5px 12px;background:#888;color:white;border:none;border-radius:4px;cursor:pointer;font-size:11px;display:none;">Cancel</button>
          <button onclick="deleteCurrentEntry()" style="padding:5px 12px;background:#d32f2f;color:white;border:none;border-radius:4px;cursor:pointer;font-size:11px;">Delete</button>
          <span id="detailStatus" style="padding:3px 10px;border-radius:10px;font-size:10px;font-weight:600;"></span>
        </div>
      </div>
      <div style="padding:18px;overflow-y:auto;flex:1;">
        <div style="margin-bottom:14px;">
          <label style="display:block;margin-bottom:4px;font-size:10px;font-weight:600;color:#8b7355;">STATUS</label>
          <select id="detailStatusSelect" onchange="changeEntryStatus()" style="width:100%;padding:9px;border:1.5px solid #d4c5a9;border-radius:8px;font-size:13px;">
            <option value="">- No Status -</option><option value="Pipe">Pipe</option><option value="VM">VM - Voicemail</option><option value="Sold">Sold</option><option value="DNC">DNC</option>
          </select>
        </div>
        <div style="margin-bottom:12px;"><label style="font-size:10px;font-weight:600;color:#8b7355;">AUTHOR</label><div id="detailAuthorNameView" style="font-size:13px;color:#3d3223;font-weight:500;"></div><input type="text" id="detailAuthorNameEdit" style="display:none;width:100%;padding:8px;border:1.5px solid #d4c5a9;border-radius:8px;font-size:13px;box-sizing:border-box;"></div>
        <div style="margin-bottom:12px;"><label style="font-size:10px;font-weight:600;color:#8b7355;">PHONE</label><div id="detailPhonesView" style="font-size:13px;color:#3d3223;"></div><input type="text" id="detailPhonesEdit" style="display:none;width:100%;padding:8px;border:1.5px solid #d4c5a9;border-radius:8px;font-size:13px;box-sizing:border-box;"></div>
        <div style="margin-bottom:12px;"><label style="font-size:10px;font-weight:600;color:#8b7355;">EMAIL</label><div id="detailEmailView" style="font-size:13px;color:#3d3223;"></div><input type="email" id="detailEmailEdit" style="display:none;width:100%;padding:8px;border:1.5px solid #d4c5a9;border-radius:8px;font-size:13px;box-sizing:border-box;"></div>
        <div style="margin-bottom:12px;"><label style="font-size:10px;font-weight:600;color:#8b7355;">BOOK</label><div id="detailBookView" style="font-size:13px;color:#3d3223;"></div><input type="text" id="detailBookEdit" style="display:none;width:100%;padding:8px;border:1.5px solid #d4c5a9;border-radius:8px;font-size:13px;box-sizing:border-box;"></div>
        <div style="margin-bottom:12px;"><label style="font-size:10px;font-weight:600;color:#8b7355;">ISBN</label><div id="detailISBNView" style="font-size:13px;color:#3d3223;"></div><input type="text" id="detailISBNEdit" style="display:none;width:100%;padding:8px;border:1.5px solid #d4c5a9;border-radius:8px;font-size:13px;box-sizing:border-box;"></div>
        <div style="margin-bottom:16px;"><label style="font-size:10px;font-weight:600;color:#8b7355;">ADDRESS</label><div id="detailAddressView" style="font-size:13px;color:#3d3223;"></div><input type="text" id="detailAddressEdit" style="display:none;width:100%;padding:8px;border:1.5px solid #d4c5a9;border-radius:8px;font-size:13px;box-sizing:border-box;"></div>
        
        <div style="border-top:2px solid rgba(232,220,200,0.5);margin:16px 0;padding-top:8px;display:flex;justify-content:space-between;">
          <span style="font-size:11px;font-weight:600;color:#5d4e37;">Remarks & Activity</span>
          <button onclick="toggleActivityView()" id="toggleActivityBtn" style="background:none;border:none;color:#8b7355;cursor:pointer;font-size:11px;text-decoration:underline;">Show All Activity</button>
        </div>
        <div id="remarksList" style="margin-bottom:14px;"></div>
        <div style="display:flex;gap:8px;">
          <input type="text" id="remarkInput" placeholder="Add a remark..." style="flex:1;padding:9px;border:1.5px solid #d4c5a9;border-radius:8px;font-size:12px;">
          <button onclick="addRemark()" style="padding:9px 14px;background:#5d4e37;color:white;border:none;border-radius:8px;cursor:pointer;font-size:12px;">Add</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>
<div class="confirm-overlay" id="confirmOverlay"><div class="confirm-box"><h3 id="confirmTitle">Confirm</h3><p id="confirmMessage">Are you sure?</p><div class="btn-row"><button class="btn-cancel" onclick="closeConfirm(false)">Cancel</button><button class="btn-confirm" id="confirmBtn">Confirm</button></div></div></div>

<div id="addEntryModal" class="confirm-overlay"><div class="confirm-box" style="width:480px;max-width:90vw;max-height:90vh;overflow-y:auto;text-align:left;"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;"><h3 style="color:#800000;margin:0;">New Entry</h3><button onclick="closeEntryModal()" style="background:none;border:none;font-size:22px;color:#999;cursor:pointer;">&times;</button></div><form onsubmit="submitEntry(event)">
      <div style="margin-bottom:14px;"><label>Author Name <span style="color:#d32f2f;">*</span></label><input type="text" id="entryAuthorName" required placeholder="Full author name" style="width:100%;padding:11px;border:1.5px solid #e0e0e0;border-radius:8px;font-size:14px;box-sizing:border-box;" oninput="updateEntrySubmitButton()"></div>
      <div style="margin-bottom:14px;"><label>Phone Number/s</label><div id="phoneNumbersContainer"><div style="display:flex;gap:8px;margin-bottom:8px;"><input type="text" class="entryPhone" placeholder="+1 234 567 8900" style="flex:1;padding:11px;border:1.5px solid #e0e0e0;border-radius:8px;font-size:14px;"><button type="button" onclick="removePhoneField(this)" style="background:#fee;color:#d32f2f;border:1px solid #fcc;border-radius:6px;cursor:pointer;font-size:12px;padding:0 10px;display:none;">Remove</button></div></div><button type="button" onclick="addPhoneField()" style="background:none;border:1px dashed #ccc;color:#666;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:12px;">+ Add Phone</button></div>
      <div style="margin-bottom:14px;"><label>Email</label><input type="email" id="entryEmail" placeholder="author@email.com" style="width:100%;padding:11px;border:1.5px solid #e0e0e0;border-radius:8px;font-size:14px;box-sizing:border-box;"></div>
      <div style="margin-bottom:14px;"><label>Book <span style="color:#d32f2f;">*</span></label><input type="text" id="entryBook" required placeholder="Book title" style="width:100%;padding:11px;border:1.5px solid #e0e0e0;border-radius:8px;font-size:14px;box-sizing:border-box;" oninput="updateEntrySubmitButton()"></div>
      <div style="margin-bottom:14px;"><label>ISBN <span style="color:#d32f2f;">*</span></label><input type="text" id="entryISBN" required placeholder="978-3-16-148410-0" style="width:100%;padding:11px;border:1.5px solid #e0e0e0;border-radius:8px;font-size:14px;box-sizing:border-box;" oninput="updateEntrySubmitButton()"></div>
      <div style="margin-bottom:14px;"><label>Address</label><input type="text" id="entryAddress" placeholder="Full address" style="width:100%;padding:11px;border:1.5px solid #e0e0e0;border-radius:8px;font-size:14px;box-sizing:border-box;"></div>
      <div id="entryError" style="display:none;color:#d32f2f;font-size:13px;margin-bottom:12px;padding:10px;background:#ffebee;border-radius:8px;"></div>
      <div style="display:flex;gap:10px;justify-content:flex-end;padding-top:14px;border-top:1px solid #eee;">
        <button type="button" onclick="closeEntryModal()" style="padding:10px 22px;background:#f0f0f0;border:none;border-radius:8px;cursor:pointer;font-size:13px;">Cancel</button>
        <button type="submit" id="entrySubmitBtn" style="padding:10px 22px;background:#800000;color:white;border:none;border-radius:8px;cursor:pointer;font-size:13px;">Save Entry</button>
      </div>
    </form></div></div>

<button id="addEntryBtn" onclick="openEntryModal()" style="position:fixed;bottom:28px;right:28px;background:#2e7d32;color:white;border:none;border-radius:12px;padding:10px 18px;font-size:13px;font-weight:500;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,0.2);opacity:0.75;z-index:100;" title="Add Entry">+ Entry</button>
