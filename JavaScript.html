function normalizeRole(role) {
  return (role || '').toString().trim().toLowerCase().replace(/[\s_-]+/g, '');
}

function dashboardElement(id) {
  var dashboard = document.getElementById(activeDashboardId);
  if (dashboard) {
    var scoped = dashboard.querySelector('#' + id);
    if (scoped) return scoped;
  }

  var fallbackScreens = ['mainScreen', 'adminScreen', 'superScreen', 'leadgenScreen'];
  for (var i = 0; i < fallbackScreens.length; i++) {
    var screen = document.getElementById(fallbackScreens[i]);
    if (screen) {
      var screenElement = screen.querySelector('#' + id);
      if (screenElement) return screenElement;
    }
  }

  return document.getElementById(id);
}

function getObjectValue(row, key) {
  if (!row) return '';
  if (row[key] !== undefined && row[key] !== null) return row[key];
  var normalizedKey = key.toLowerCase();
  for (var prop in row) {
    if (Object.prototype.hasOwnProperty.call(row, prop) && prop.toLowerCase() === normalizedKey) {
      return row[prop];
    }
  }
  return '';
}

function routeUserByRole() {
  var role = normalizeRole(currentUser && currentUser.role);
  if (role === 'superadmin') showSuperAdmin();
  else if (role === 'admin') showAdmin();
  else if (role === 'leadgenspecialist') showLeadgen();
  else showMain();
}

function validateEmail() {

  var usernameInput = document.getElementById('username');
  var message = document.getElementById('message');

  if (!usernameInput || !message) {
    return;
  }

  var username = usernameInput.value.trim();
  if (!username.includes('@')) {
    message.textContent = 'Invalid email: @ is required';
    message.style.color = 'red';
  } else { message.textContent = 'Valid email'; message.style.color = 'green'; }
}

var usernameInput = document.getElementById('username');
if (usernameInput) {
  usernameInput.addEventListener('input', validateEmail);
}


function updateClock() { 
  var d = new Date(), el = dashboardElement('currentDate') || dashboardElement('leadgenCurrentDate');
  if (el) el.textContent = d.toLocaleString('en-US', {timeZone: currentTimeZone, weekday:'long', year:'numeric', month:'long', day:'numeric', hour:'2-digit', minute:'2-digit'}); 
}

function populateUser() {
  if (!currentUser) return;
  var p = currentUser.name.split(' ').filter(Boolean), 
      ini = p.length > 1 ? (p[0][0]+p[p.length-1][0]).toUpperCase() : (p[0]||'').substring(0,2).toUpperCase();
  var avatar = dashboardElement('agentAvatar') || dashboardElement('leadgenAvatar') || dashboardElement('avatar');
  var userName = dashboardElement('userName') || dashboardElement('leadgenUserName');
  var userEmail = dashboardElement('userEmail') || dashboardElement('leadgenUserEmail');
  var userRole = dashboardElement('userRole') || dashboardElement('leadgenUserRole');
    var userTeam = dashboardElement('userTeam');
  if (avatar) avatar.textContent = ini;
  if (userName) userName.textContent = currentUser.name;
  if (userEmail) userEmail.textContent = currentUser.email || '';
  if (userRole) userRole.textContent = currentUser.role || '';
  if (userTeam) userTeam.textContent = currentUser.team || currentUser.position || '';
}


function handleLogin(e) {

  e.preventDefault();

  var emailEl =
    document.getElementById('email');

  var passwordEl =
    document.getElementById('password');

  var loginButton =
    document.getElementById('loginButton');

  var loginError =
    document.getElementById('loginError');
  var emailPattern = /^[A-Z0-9._%+-]+@explorabooks\.com$/i;

  if (!emailEl || !passwordEl) { console.error('Login fields not found.'); return; }
  var u =
    emailEl.value.trim();

  var p =
    passwordEl.value;

  if (loginError) { loginError.style.display = 'none'; }
  if (!u) { if (loginError) { loginError.textContent = 'Please enter your email address.'; loginError.style.display = 'block'; } return; }
  if (!emailPattern.test(u)) { if (loginError) { loginError.textContent = 'Please use your @explorabooks.com email address.'; loginError.style.display = 'block'; } return; }
  if (!p) { if (loginError) { loginError.textContent = 'Please enter your password.'; loginError.style.display = 'block'; } return; }
  if (loginButton) { loginButton.disabled = true; loginButton.textContent = 'Signing in...'; }

  google.script.run

    .withSuccessHandler(function(r) {
      if (loginButton) { loginButton.disabled = false; loginButton.textContent = 'Sign In'; }
      console.log('Login response:', r);

      if (!r || !r.success) { if (loginError) { loginError.textContent = r && r.message ? r.message : 'Login failed.'; loginError.style.display = 'block'; } return; }
      SESSION_ID =
        r.sessionId;

      sessionStorage.setItem(
        'crm_session',
        SESSION_ID
      );

      currentUser = r.user;
      var role = normalizeRole(currentUser && currentUser.role);

      console.log('Logged-in User:', currentUser);

      populateUser();

      console.log('User Role:', r.user.role);
      console.log('Normalized Role:', role);
      routeUserByRole();
      startSessionMonitoring(); })

    .withFailureHandler(function(serverError) {

      console.error( 'loginUser() failed:', serverError );
      if (loginButton) { loginButton.disabled = false; loginButton.textContent = 'Sign In'; }
      if (loginError) { loginError.textContent = 'Unable to connect to server.'; loginError.style.display = 'block'; } }) .loginUser(u, p);
}

function handleLogout() {

  // Logout from server
  stopSessionMonitoring();
  if (SESSION_ID) {
    google.script.run.logoutUser(SESSION_ID);
  }

  // Clear browser session
  sessionStorage.removeItem('crm_session');

  SESSION_ID = null;
  currentUser = null;

  // Hide all dashboard screens
  var mainScreen = document.getElementById('mainScreen');
  var adminScreen = document.getElementById('adminScreen');
  var superScreen = document.getElementById('superScreen');
  var leadgenScreen = document.getElementById('leadgenScreen');

  if (mainScreen) {
    mainScreen.style.display = 'none';
  }

  if (adminScreen) {
    adminScreen.style.display = 'none';
  }

  if (superScreen) {
    superScreen.style.display = 'none';
  }

  if (leadgenScreen) {
    leadgenScreen.style.display = 'none';
  }

  // Show login screen
  var loginScreen = document.getElementById('loginScreen');

  if (loginScreen) {
    loginScreen.style.display = 'block';
  }
}

function showToast(message, type) { 
  var toast = dashboardElement('toast');
  toast.textContent = message; 
  toast.className = 'toast ' + (type || 'success'); 
  toast.style.display = 'block'; 
  clearTimeout(toast._timeout); 
  toast._timeout = setTimeout(function() { toast.style.display = 'none'; }, 5000); 
}

function showConfirm(title, message, onConfirm, confirmColor) { 
  dashboardElement('confirmTitle').textContent = title || 'Confirm';
  dashboardElement('confirmMessage').innerHTML = message || 'Are you sure?';
  dashboardElement('confirmBtn').style.background = confirmColor || '#d32f2f';
  dashboardElement('confirmOverlay').style.display = 'flex';
  confirmCallback = onConfirm; 
}

function closeConfirm(confirmed) { 
  dashboardElement('confirmOverlay').style.display = 'none';
  if (confirmed && typeof confirmCallback === 'function') { 
    var cb = confirmCallback; confirmCallback = null; 
    cb(); 
  } 
}

function openUserModal() {
  ['userUsername', 'userPassword', 'userNameInput', 'userEmailInput'].forEach(function(id) {
    dashboardElement(id).value = '';
  });
  if (dashboardElement('userRoleInput')) dashboardElement('userRoleInput').value = 'Agent';
  if (dashboardElement('userStatusInput')) dashboardElement('userStatusInput').value = 'Active';
  if (dashboardElement('userPositionInput')) dashboardElement('userPositionInput').value = 'BM';

  dashboardElement('userError').style.display = 'none';
  dashboardElement('addUserModal').style.display = 'flex';

function closeUserModal() {
  dashboardElement('addUserModal').style.display = 'none';
}

function updateUserPositionState() {
  var role = dashboardElement('userRoleInput');
  var position = dashboardElement('userPositionInput');

  if (!role || !position) return;

  var isRestrictedRole =
    role.value === 'Super Admin' ||
    role.value === 'Lead Gen Specialist';

  position.disabled = isRestrictedRole;

  if (isRestrictedRole) {
    position.value = '';
  } else if (!position.value) {
    position.value = 'BM';
  }
}


function submitUser(event) {
  event.preventDefault();
  var error = dashboardElement('userError');
  error.style.display = 'none';
  var userData = {
    username: dashboardElement('userUsername').value.trim(),
    password: dashboardElement('userPassword').value,
    name: dashboardElement('userNameInput').value.trim(),
    email: dashboardElement('userEmailInput').value.trim(),
    role: dashboardElement('userRoleInput').value,
    status: dashboardElement('userStatusInput') ? dashboardElement('userStatusInput').value : 'Active',
    position: dashboardElement('userPositionInput') && !dashboardElement('userPositionInput').disabled ? dashboardElement('userPositionInput').value : ''
  };
  google.script.run
    .withSuccessHandler(function(response) {
      if (response && response.success) {
        closeUserModal();
        showToast('User added.', 'success');
      } else {
        error.textContent = response && response.message ? response.message : 'Unable to add user.';
        error.style.display = 'block';
      }
    })
    .withFailureHandler(function() {
      error.textContent = 'Unable to connect to server.';
      error.style.display = 'block';
    })
    .addUser(SESSION_ID, userData);
}

function addPhoneField() { 
  var c = dashboardElement('phoneNumbersContainer'), d = document.createElement('div');
  d.style.cssText = 'display:flex;gap:8px;margin-bottom:8px;'; 
  d.innerHTML = '<input type="text" class="entryPhone" placeholder="+1 234 567 8900" style="flex:1;padding:11px;border:1.5px solid #e0e0e0;border-radius:8px;font-size:14px;"><button type="button" onclick="removePhoneField(this)" style="background:#fee;color:#d32f2f;border:1px solid #fcc;border-radius:6px;cursor:pointer;font-size:12px;padding:0 10px;">Remove</button>'; 
  c.appendChild(d); updateRemoveButtons(); 
}

function removePhoneField(b) { 
  var c = dashboardElement('phoneNumbersContainer');
  if (c.children.length > 1) { b.parentElement.remove(); updateRemoveButtons(); } 
}

function updateRemoveButtons() { 
  var rb = dashboardElement('phoneNumbersContainer').querySelectorAll('button');
  if (rb.length <= 1) rb.forEach(function(b) { b.style.display = 'none'; }); 
  else rb.forEach(function(b) { b.style.display = 'inline-block'; }); 
}

function updateEntrySubmitButton() { 
    var an = dashboardElement('entryAuthorName').value.trim(),
      bk = dashboardElement('entryBook').value.trim(),
      is = dashboardElement('entryISBN').value.trim();
    var b = dashboardElement('entrySubmitBtn');
  b.disabled = !(an && bk && is); 
  b.style.opacity = b.disabled ? '0.5' : '1'; 
}

function submitEntry(e) { 
  e.preventDefault(); 
  if (isSubmitting) return; 
  isSubmitting = true; 
    var an = dashboardElement('entryAuthorName').value.trim(),
      bk = dashboardElement('entryBook').value.trim(),
      is = dashboardElement('entryISBN').value.trim(),
      em = dashboardElement('entryEmail').value.trim(),
      ad = dashboardElement('entryAddress').value.trim();
    var dashboard = document.getElementById(activeDashboardId), pi = dashboard.querySelectorAll('.entryPhone'), ph = [];
  pi.forEach(function(i) { var v = i.value.trim(); if (v) ph.push(v); }); 
  var er = dashboardElement('entryError');
  er.style.display = 'none'; 
  if (!an || !bk || !is) { er.textContent = 'Author Name, Book, and ISBN are required.'; er.style.display = 'block'; isSubmitting = false; return; } 
  google.script.run.withSuccessHandler(function(r) { 
    isSubmitting = false; 
    if (r.success) { showToast('Entry saved!', 'success'); closeEntryModal(); loadEntries(); } 
    else { er.textContent = r.message; er.style.display = 'block'; } 
  }).addEntry(SESSION_ID, {authorName:an, phones:ph.join(', '), email:em, book:bk, isbn:is, address:ad}); 
}

var allEntries = [];
var allUsers = [];
var selectedUserId = null;
var selectedUserData = null;

function openCity(event, cityName) {
  var dashboard = document.getElementById(activeDashboardId);
  if (!dashboard) return;
  dashboard.querySelectorAll('.tabcontent').forEach(function(tab) { tab.style.display = 'none'; tab.classList.remove('is-active'); });
  dashboard.querySelectorAll('.tablinks').forEach(function(button) { button.classList.remove('active'); });
  var tab = dashboard.querySelector('#' + cityName);
  if (tab) { tab.style.display = 'flex'; tab.classList.add('is-active'); }
  if (event && event.currentTarget) event.currentTarget.classList.add('active');
  else {
    dashboard.querySelectorAll('.tablinks').forEach(function(button) {
      if (button.getAttribute('onclick') && button.getAttribute('onclick').indexOf("'" + cityName + "'") > -1) button.classList.add('active');
    });
  }
  var detail = dashboard.querySelector('#detailContent');
  var userDetail = dashboard.querySelector('#userDetailContent');
  var empty = dashboard.querySelector('#detailEmpty');
  if (cityName === 'Users') {
    if (detail) detail.style.display = 'none';
    if (userDetail) userDetail.style.display = selectedUserData ? 'flex' : 'none';
    if (empty) empty.style.display = selectedUserData ? 'none' : 'block';
    loadUsers();
  } else {
    if (userDetail) userDetail.style.display = 'none';
    if (detail) detail.style.display = selectedEntryData ? 'flex' : 'none';
    if (empty) empty.style.display = selectedEntryData ? 'none' : 'block';
  }
}

function loadUsers() {
  var tableBody = dashboardElement(activeDashboardId === 'superScreen' ? 'superUsersTableBody' : 'adminUsersTableBody');
  if (!tableBody || !SESSION_ID) return;
  tableBody.innerHTML = '<tr><td colspan="6" style="padding:60px;text-align:center;color:#aaa;">Loading users...</td></tr>';
  google.script.run.withSuccessHandler(function(response) {
    if (response && response.success) {
      allUsers = response.users || [];
      filterTable();
      if (selectedUserId !== null) selectUser(selectedUserId);
    } else {
      tableBody.innerHTML = '<tr><td colspan="6" style="padding:60px;text-align:center;color:#d32f2f;">Unable to load users.</td></tr>';
    }
  }).withFailureHandler(function() {
    tableBody.innerHTML = '<tr><td colspan="6" style="padding:60px;text-align:center;color:#d32f2f;">Unable to connect to server.</td></tr>';
  }).getUsers(SESSION_ID);
}

function renderUsers(users) {
  var tableBody = dashboardElement(activeDashboardId === 'superScreen' ? 'superUsersTableBody' : 'adminUsersTableBody');
  if (!tableBody) return;
  var countElement = dashboardElement(activeDashboardId === 'superScreen' ? 'superEntryCount' : 'entryCount');
  countElement.textContent = users.length + ' User' + (users.length !== 1 ? 's' : '');
  if (!users.length) {
    tableBody.innerHTML = '<tr><td colspan="6" style="padding:60px;text-align:center;color:#aaa;">No users found.</td></tr>';
    return;
  }
  var html = '';
  var userRowAction = '';
  users.forEach(function(user) {
    var statusColor = user.status === 'Active' ? '#2e7d32' : '#999';
    var statusBackground = user.status === 'Active' ? '#e8f5e9' : '#f5f5f5';
    var dashboard = document.getElementById(activeDashboardId);
    var canEditUsers = activeDashboardId === 'superScreen' || (dashboard && dashboard.querySelector('#userDetailContent'));
    userRowAction = canEditUsers ? ' onclick="selectUser(' + JSON.stringify(user.id) + ')"' : '';
    html += '<tr' + userRowAction + ' style="cursor:' + (canEditUsers ? 'pointer' : 'default') + ';border-bottom:1px solid #f0f0f0;" onmouseover="this.style.background=\'#f8f9fb\'" onmouseout="this.style.background=\'transparent\'">' +
      '<td style="padding:9px 12px;font-weight:500;text-align:center;">' + escapeHtml(user.name) + '</td>' +
      '<td style="padding:9px 12px;color:#555;text-align:center;">' + escapeHtml(user.email) + '</td>' +
      '<td style="padding:9px 12px;color:#555;text-align:center;">' + escapeHtml(user.position) + '</td>' +
      '<td style="padding:9px 12px;color:#555;text-align:center;">' + escapeHtml(user.role) + '</td>' +
      '<td style="padding:9px 12px;text-align:center;"><span style="display:inline-block;padding:3px 10px;border-radius:10px;font-size:10px;font-weight:600;color:' + statusColor + ';background:' + statusBackground + ';">' + escapeHtml(user.status || 'None') + '</span></td>' +
      '<td style="padding:9px 12px;color:#555;text-align:center;">' + escapeHtml(user.ip || '-') + '</td></tr>';
  });
  tableBody.innerHTML = html;
}

function selectUser(userId) {
  selectedUserData = null;
  for (var i = 0; i < allUsers.length; i++) {
    if (String(allUsers[i].id) === String(userId)) { selectedUserData = allUsers[i]; break; }
  }
  if (!selectedUserData) return;
  selectedUserId = selectedUserData.id;

  var detailEmpty = dashboardElement('detailEmpty');
  var detailContent = dashboardElement('detailContent');
  var userDetailContent = dashboardElement('userDetailContent');
  if (detailEmpty) detailEmpty.style.display = 'none';
  if (detailContent) detailContent.style.display = 'none';
  if (userDetailContent) userDetailContent.style.display = 'flex';

  setUserViewMode();
  ['Username','Name','Email','Position','Role','Status','Ip'].forEach(function(field) {
    var key = field.toLowerCase();
    var value = getObjectValue(selectedUserData, key) || '-';
    var view = dashboardElement('userDetail' + field + 'View');
    var edit = dashboardElement('userDetail' + field + 'Edit');
    if (view) view.textContent = value;
    if (edit) edit.value = getObjectValue(selectedUserData, key) || '';
  });

  var passwordField = dashboardElement('userDetailPasswordEdit');
  if (passwordField) passwordField.value = '';
  updateUserEditPositionState();
  updateUserStatusBadge(getObjectValue(selectedUserData, 'status'));
}

function setUserViewMode() {
  ['userDetailUsernameView','userDetailNameView','userDetailEmailView','userDetailPositionView','userDetailRoleView','userDetailStatusView','userDetailIpView'].forEach(function(id) { dashboardElement(id).style.display = 'block'; });
  ['userDetailUsernameEdit','userDetailNameEdit','userDetailEmailEdit','userDetailPositionEdit','userDetailRoleEdit','userDetailStatusEdit','userDetailIpEdit','userDetailPasswordEdit'].forEach(function(id) { dashboardElement(id).style.display = 'none'; });
  dashboardElement('userEditBtn').style.display = 'inline-block';
  dashboardElement('userSaveEditBtn').style.display = 'none';
  dashboardElement('userCancelEditBtn').style.display = 'none';
  dashboardElement('userDetailPositionEdit').disabled = false;
  isUserEditMode = false;
}

function updateUserEditPositionState() {
  var role = dashboardElement('userDetailRoleEdit');
  var position = dashboardElement('userDetailPositionEdit');
  if (!role || !position) return;
  var isSuperAdmin = role.value === 'Super Admin';
  position.disabled = isSuperAdmin;
  if (isSuperAdmin) position.value = '';
}

function toggleUserEditMode() {

var columnFilters = {};

function loadEntries(scope, onComplete) {
  scope = scope || (activeDashboardId === 'mainScreen' ? 'main' : activeDashboardId === 'superScreen' ? 'superadmin' : 'admin');
  if (!SESSION_ID) return;
  var tableBody = dashboardElement(scope === 'superadmin' ? 'superEntriesTableBody' : activeDashboardId === 'leadgenScreen' ? 'LeadentriesTableBody' : 'entriesTableBody');
  if (!tableBody) {
    console.error('Entries table not found for dashboard:', activeDashboardId);
    return;
  }
  tableBody.innerHTML = '<tr><td colspan="5" style="padding:60px;text-align:center;color:#aaa;">Loading...</td></tr>';
  var handleResponse = function(r) {
    if (r && r.success) {
      allEntries = r.entries || [];
      buildFilterOptions();
      filterTable();
      updateSummaryCards(r.summary || {});
      if (typeof onComplete === 'function') onComplete();
    } else {
      tableBody.innerHTML = '<tr><td colspan="5" style="padding:60px;text-align:center;color:#d32f2f;">Unable to load entries.</td></tr>';
    }
  };
  var request = google.script.run
    .withSuccessHandler(handleResponse)
    .withFailureHandler(function() {
      tableBody.innerHTML = '<tr><td colspan="5" style="padding:60px;text-align:center;color:#d32f2f;">Unable to connect to server.</td></tr>';
    });
  if (scope === 'main') request.getEntriesForAgent(SESSION_ID);
  else request.getEntries(SESSION_ID);
}

function renderTable(entries) { 
  var tb = dashboardElement(activeDashboardId === 'superScreen' ? 'superEntriesTableBody' : activeDashboardId === 'leadgenScreen' ? 'LeadentriesTableBody' : 'entriesTableBody');
  var count = dashboardElement(activeDashboardId === 'superScreen' ? 'superEntryCount' : 'entryCount');
  if (!tb) return;
  if (count) count.textContent = entries.length + ' Entr' + (entries.length !== 1 ? 'ies' : 'y');
  if (!entries.length) { tb.innerHTML = '<tr><td colspan="5" style="padding:60px;text-align:center;color:#aaa;">No entries found.</td></tr>'; return; } 
  var h = ''; 
  entries.forEach(function(e) { 
    var sc, sb;
    if (!e.status || e.status === '') { sc = '#999'; sb = '#f5f5f5'; }
    else if (e.status === 'Sold') { sc = '#2e7d32'; sb = '#e8f5e9'; }
    else if (e.status === 'DNC') { sc = '#c62828'; sb = '#ffebee'; }
    else if (e.status === 'VM') { sc = '#c2185b'; sb = '#fce4ec'; }
    else if (e.status === 'Pending') { sc = '#f39c12'; sb = '#fef5e7'; }
    else { sc = '#e67e22'; sb = '#fff3e0'; }
    h += '<tr onclick="selectEntry('+e.id+')" style="cursor:pointer;border-bottom:1px solid #f0f0f0;" onmouseover="this.style.background=\'#f8f9fb\'" onmouseout="this.style.background=\'transparent\'">' +
      '<td style="padding:9px 12px;font-weight:500;text-align:center;">'+escapeHtml(e.authorName)+'</td>' +
      '<td style="padding:9px 12px;color:#555;text-align:center;">'+escapeHtml(e.book)+'</td>' +
      '<td style="padding:9px 12px;color:#555;text-align:center;">'+escapeHtml(e.isbn)+'</td>' +
      '<td style="padding:9px 12px;color:#555;text-align:center;">'+(escapeHtml(e.assignedAgentName)||'<span style="color:#999;">Unassigned</span>')+'</td>' +
      '<td style="padding:9px 12px;text-align:center;"><span style="display:inline-block;padding:3px 10px;border-radius:10px;font-size:10px;font-weight:600;color:'+sc+';background:'+sb+';">'+(e.status||'None')+'</span></td></tr>'; 
  }); 
  tb.innerHTML = h; 
}

function getFilteredEntries() { 
  var f = allEntries.slice(); 
  var st = dashboardElement(activeDashboardId === 'superScreen' ? 'superSearchInput' : 'searchInput').value.trim().toLowerCase();
  if (st) f = f.filter(function(e) { return (e.authorName&&e.authorName.toLowerCase().indexOf(st)>-1)||(e.book&&e.book.toLowerCase().indexOf(st)>-1)||(e.isbn&&e.isbn.toLowerCase().indexOf(st)>-1)||(e.assignedAgentName&&e.assignedAgentName.toLowerCase().indexOf(st)>-1)||(e.status&&e.status.toLowerCase().indexOf(st)>-1); }); 
  for (var field in columnFilters) { if (columnFilters[field] && columnFilters[field].length > 0) f = f.filter(function(e) { var v = ''; switch(field) { case 'author': v=e.authorName; break; case 'book': v=e.book; break; case 'agent': v=e.assignedAgentName; break; case 'status': v=e.status; break; } return columnFilters[field].indexOf(v) > -1; }); } 
  if (activeStatusFilter) f = f.filter(function(e) { return e.status === activeStatusFilter; }); 
  return f; 
}


function filterTable() {
  var dashboard = document.getElementById(activeDashboardId);
  var usersTab = dashboard && dashboard.querySelector('#Users');
  if (usersTab && usersTab.style.display !== 'none') {
    var searchInput = dashboardElement(activeDashboardId === 'superScreen' ? 'superSearchInput' : 'searchInput');
    var search = searchInput ? searchInput.value.trim().toLowerCase() : '';
    var filteredUsers = allUsers.filter(function(user) {
      return !search || [user.name, user.email, user.position, user.role, user.status, user.ip].some(function(value) {
        return value && value.toString().toLowerCase().indexOf(search) > -1;
      });
    });
    renderUsers(filteredUsers);
    return;
  }
  renderTable(getFilteredEntries());
}

function buildFilterOptions() { 
  ['author','book','status'].forEach(function(field) { 
    var dashboard = document.getElementById(activeDashboardId);
    var lc = dashboard && dashboard.querySelector('#filterDropdown-'+field+' .filter-options-list');
    if (!lc) return; 
    var vals = {}; 
    allEntries.forEach(function(e) { var v = ''; switch(field){case'author':v=e.authorName;break;case'book':v=e.book;break;case'status':v=e.status;break;} if(v)vals[v]=(vals[v]||0)+1; }); 
    var sv = Object.keys(vals).sort(); 
    var h = ''; 
    sv.forEach(function(val) { var is = columnFilters[field] && columnFilters[field].indexOf(val) > -1; h += '<div onclick="return toggleColumnFilter(\''+field+'\', \''+escapeHtml(val).replace(/'/g,"\\'")+'\', event)" style="padding:8px 14px;cursor:pointer;font-size:12px;display:flex;align-items:center;gap:8px;" onmouseover="this.style.background=\'#f8f9fb\'" onmouseout="this.style.background=\'transparent\'"><input type="checkbox" '+(is?'checked':'')+' style="pointer-events:none;"><span>'+escapeHtml(val)+'</span><span style="color:#aaa;font-size:11px;">'+vals[val]+'</span></div>'; }); 
    lc.innerHTML = h; 
  }); 
}

function toggleFilterDropdown(event, field) { 
  event.preventDefault(); event.stopPropagation();

function filterDropdownOptions(input, field) { 
  var st = input.value.toLowerCase(); 
  var dashboard = document.getElementById(activeDashboardId);

function toggleColumnFilter(field, value, event) { 
  if (event) { event.preventDefault(); event.stopPropagation(); } 
  if (!columnFilters[field]) columnFilters[field] = []; 
  var i = columnFilters[field].indexOf(value); 
  if (i > -1) columnFilters[field].splice(i, 1); 
  else columnFilters[field].push(value); 
  filterTable(); 
  return false; 
}

  var numEntryId = Number(entryId);

  for (var i = 0; i < allEntries.length; i++) {
    if (String(allEntries[i].id) === String(entryId) || Number(allEntries[i].id) === numEntryId) {

    ['detailAuthorNameView', 'authorName'],

    ['detailISBNView', 'isbn'],
    ['detailAddressView', 'address']
  ];
  viewFields.forEach(function(pair) {

   // Submit Transfer Request
function submitTransferRequest() {

  if (!selectedEntryId) {
    showToast('No lead selected.', 'error');
    return;
  }

  var targetSelect = document.getElementById('transferTarget');
  var reasonInput = document.getElementById('transferReason');

  if (!targetSelect) {
    showToast('Transfer target field not found.', 'error');
    return;
  }

  var targetAgentId = targetSelect.value;
  var reason = reasonInput ? reasonInput.value.trim() : '';

  if (!targetAgentId) {
    showToast('Please select a transfer target.', 'error');
    return;
  }

  var submitBtn = document.getElementById('submitTransferBtn');

  if (submitBtn) {
    if (submitBtn.disabled) return;

    submitBtn.disabled = true;
    submitBtn.style.opacity = '0.5';
    submitBtn.textContent = 'Submitting...';
  }

  console.log('TRANSFER DEBUG:', {
    sessionId: SESSION_ID,
    entryId: selectedEntryId,
    targetAgentId: targetAgentId,
    reason: reason
  });

  google.script.run

    .withSuccessHandler(function(response) {

      console.log(
        'CREATE TRANSFER RESPONSE:',
        response
      );

      if (submitBtn) {
        submitBtn.disabled = false;
        submitBtn.style.opacity = '1';
        submitBtn.textContent = 'Request Transfer';
      }

      if (response && response.success) {

        showToast(
          response.message ||
          'Transfer request submitted for approval.',
          'success'
        );

        var modal =
          document.getElementById('transferLeadModalAdmin');

        if (modal) {
          modal.style.display = 'none';
        }

        if (targetSelect) {
          targetSelect.value = '';
        }

        if (reasonInput) {
          reasonInput.value = '';
        }

        loadRemarksOnly();

      } else {

        console.error(
          'TRANSFER SERVER REJECTED:',
          response
        );

        showToast(
          'TRANSFER REJECTED: ' +
          (
            response && response.message
              ? response.message
              : 'No message returned by server.'
          ),
          'error'
        );
      }

    })

    .withFailureHandler(function(error) {

      console.error(
        'CREATE TRANSFER SERVER ERROR:',
        error
      );

      if (submitBtn) {
        submitBtn.disabled = false;
        submitBtn.style.opacity = '1';
        submitBtn.textContent = 'Request Transfer';
      }

      showToast(
        'SERVER ERROR: ' +
        (
          error && error.message
            ? error.message
            : String(error)
        ),
        'error'
      );

    })

    .createTransferRequest(
      SESSION_ID,
      selectedEntryId,
      targetAgentId,
      reason
    );
}


// ========== CONFIRM EXTEND GRACE PERIOD ==========
function confirmExtendGracePeriod() {
  if ( !selectedEntryId || !selectedEntryData ) { return; }
  if ( selectedEntryData.transferPending === true ) { return; }
  var confirmBtn = document.getElementById( 'confirmExtendBtn' );
  var error = document.getElementById( 'extendGraceError' );
  if (confirmBtn) { confirmBtn.disabled = true; confirmBtn.style.opacity = '0.6'; confirmBtn.style.cursor = 'not-allowed'; }
  if (error) { error.style.display = 'none'; error.textContent = ''; }

  google.script.run

    .withSuccessHandler(function(result) {

      if (confirmBtn) {

        confirmBtn.disabled = false;
        confirmBtn.style.opacity = '1';
        confirmBtn.style.cursor = 'pointer';

      }

      if (!result || !result.success) {

        if (error) {

          error.textContent =
            (result && result.message)
              ? result.message
              : 'Unable to extend the grace period.';

          error.style.display =
            'block';
        }

        return;
      }

      closeExtendModal();
      showToast( 'Grace period successfully extended.', 'success' );

      // the updated StatusStartedAt state.
      loadEntries(undefined, function() {
        if (!selectedEntryId) { return; }
        selectEntry( selectedEntryId );

      });

    })

    .withFailureHandler(function(err) {
      console.error( 'extendLeadGracePeriod failed:', err );

      if (confirmBtn) { confirmBtn.disabled = false; confirmBtn.style.opacity = '1'; confirmBtn.style.cursor = 'pointer'; }
      if (error) { error.textContent = 'Unable to extend the grace period. Please try again.'; error.style.display = 'block'; }

    })

    .extendLeadGracePeriod( SESSION_ID, selectedEntryId );
}

function updateExtendButton(entry) {

      ? entry.originalStatus
      : entry.status;

  //
  // No Status
  // Pipe
  // VM
  // ==========================================

  var canExtend =
    status === '' ||
    status === 'Pipe' ||

// ========== STATUS DROPDOWN PERMISSIONS ==========
function updateStatusDropdownPermissions(entry) {
  var select = dashboardElement('detailStatusSelect');
  if (!select || !entry) return;
  select.disabled = false;
  for (var i = 0; i < select.options.length; i++) { select.options[i].disabled = false; }
  if (entry.transferPending === true) { select.disabled = true; return; }
  if (!currentUser) return;
  if ( String(entry.status || '').trim() === 'Sold' ) { select.disabled = true; return; }
  var minedById = entry.minedById ? String(entry.minedById).trim() : '';
  var currentUserId = currentUser.id ? String(currentUser.id).trim() : '';
  var isOwnLead = minedById !== '' && currentUserId !== '' && minedById === currentUserId;
  var currentStatus = entry.status ? String(entry.status).trim() : '';
  var noStatusOption = select.querySelector( 'option[value=""]' );
  var exclusiveOption = select.querySelector( 'option[value="Exclusive"]' );
  if (normalizeRole(currentUser.role) === 'superadmin') { return; }
  if (currentUser.role === 'Admin') { if (isOwnLead) { if (noStatusOption) { noStatusOption.disabled = true; } } return; }
  if (currentUser.role === 'Sales Partner') {
    if (isOwnLead) { if (noStatusOption) { noStatusOption.disabled = true; } return; }
    if (noStatusOption) { if (currentStatus !== '') { noStatusOption.disabled = true; } }
    if (exclusiveOption) { exclusiveOption.disabled = true; } return; } return; 
  }

  // ========== TRANSFER PENDING PERMISSIONS ==========
function updateTransferPendingPermissions(entry) {

  if (!entry) return;

  var transferBtn = dashboardElement('transferBtn');
  var editBtn = dashboardElement('editBtn');
  var wrongNumberBtn = dashboardElement('wrongNumberBtn');
  var saveEditBtn = dashboardElement('saveEditBtn');
  var cancelEditBtn = dashboardElement('cancelEditBtn');
  var statusSelect = dashboardElement('detailStatusSelect');

  var isPending = entry.transferPending === true;

  if (isPending) {

    // Transfer button
    if (transferBtn) {
      transferBtn.disabled = true;
      transferBtn.style.opacity = '0.5';
      transferBtn.style.cursor = 'not-allowed';
    }

    // Edit button
    if (editBtn) {
      editBtn.disabled = true;
      editBtn.style.opacity = '0.5';
      editBtn.style.cursor = 'not-allowed';
    }

    // wrongNumberBtn button
    if (wrongNumberBtn) {
      wrongNumberBtn.disabled = true;
      wrongNumberBtn.style.opacity = '0.5';
      wrongNumberBtn.style.cursor = 'not-allowed';
    }

    // Status dropdown
    if (statusSelect) {
      statusSelect.disabled = true;
    }

    // If somehow already in edit mode, force view mode
    if (
      typeof isEditMode !== 'undefined' &&
      isEditMode === true
    ) {
      if (typeof setViewMode === 'function') {
        setViewMode();
      }
    }

    return;
  }

  if (transferBtn) {
    transferBtn.disabled = false;
    transferBtn.style.opacity = '1';
    transferBtn.style.cursor = 'pointer';
  }

  if (editBtn) {
    editBtn.disabled = false;
    editBtn.style.opacity = '1';
    editBtn.style.cursor = 'pointer';
  }

  if (wrongNumberBtn) {
    wrongNumberBtn.disabled = false;
    wrongNumberBtn.style.opacity = '1';
    wrongNumberBtn.style.cursor = 'pointer';
  }

  // Re-apply normal status permissions
  updateStatusDropdownPermissions(entry);
}


// ==========PHONE FORMATTER ==========
function formatUSPhoneNumber(value) {
  var digits = value.replace(/\D/g, '');
  if ( digits.length === 11 && digits.charAt(0) === '1' ) {
    digits = digits.substring(1); } 
  digits = digits.substring(0, 10);
  if (digits.length <= 3) { return digits;
  } else if (digits.length <= 6) {
    return '(' + digits.substring(0, 3) + ') ' + digits.substring(3);
  } else {
    return '(' + digits.substring(0, 3) + ') ' + digits.substring(3, 6) + '-' + digits.substring(6); }
}

function handleUSPhoneInput(input) {
  var oldValue = input.value;
  var formatted = formatUSPhoneNumber(oldValue);
  input.value = formatted;
  saveEntryDraft();
  input.setSelectionRange( formatted.length, formatted.length );
}

function handleEditPhoneInput(input) {

}

var sessionCheckInterval = null;

function startSessionMonitoring() {
  if (sessionCheckInterval) { clearInterval(sessionCheckInterval); }
  sessionCheckInterval = setInterval(function() {
    if (!SESSION_ID) return;
    google.script.run .withSuccessHandler(function(result) {
        if (!result || !result.success) { handleSessionExpired(); } })
      .withFailureHandler(function() { })
      .validateSession(SESSION_ID); }, 60000);
}

function stopSessionMonitoring() {
  if (sessionCheckInterval) { clearInterval(sessionCheckInterval); sessionCheckInterval = null; }
}

function handleSessionExpired() {
  stopSessionMonitoring();
  SESSION_ID = null;
  currentUser = null;
  sessionStorage.removeItem('crm_session');
  var activeScreen = document.getElementById(activeDashboardId);
  if (activeScreen) activeScreen.style.display = 'none';
  var loginScreen = document.getElementById('loginScreen');
  if (loginScreen) loginScreen.style.display = 'flex';
  var error = document.getElementById('loginError');
  if (error) {
    error.textContent = 'Your session has expired. Please log in again during your next available shift.';
    error.style.display = 'block'; }
  var username = document.getElementById('email') || document.getElementById('username');
  var password = document.getElementById('password');
  if (username) username.value = '';
  if (password) password.value = '';
}

// ========== APPS SCRIPT ERROR HANDLER ==========
function handleServerError(error, context) {
  console.error( 'Apps Script error [' + (context || 'Unknown') + ']:', error );
  var message = 'Something went wrong. Please try again.';
  if (error && error.message) { message = error.message; } showToast(message, 'error');
}
