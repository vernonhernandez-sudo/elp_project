<script>
var SESSION_ID = null;
var currentUser = null;
var showingAllActivity = false;
var confirmCallback = null;
var isSubmitting = false;
var currentTimeZone = 'America/Los_Angeles';
var activeStatusFilter = null;
var activeDashboardId = 'mainScreen';

function normalizeRole(role) {
  return (role || '').toString().trim().toLowerCase().replace(/[\s_-]+/g, '');
}

function dashboardElement(id) {
  var dashboard = document.getElementById(activeDashboardId);
  return dashboard ? dashboard.querySelector('#' + id) : document.getElementById(id);
}

(function() {
  var stored = sessionStorage.getItem('crm_session');

  if (stored) {
    SESSION_ID = stored;

    google.script.run.withSuccessHandler(function(u) {

      if (u && u.name) {

        var role = normalizeRole(u.role);

        activeDashboardId = role === 'superadmin' ? 'superScreen' : role === 'admin' ? 'adminScreen' : 'mainScreen';
        currentUser = u;
        populateUser();

        console.log('Cached User:', u);
        console.log('Cached Role:', u.role);
        console.log('Normalized Cached Role:', role);

        if (role === 'superadmin') {

          showSuperAdmin();

        } else if (role === 'admin') {

          showAdmin();

        } else {

          showMain();
        }
      }

    }).getUserFromCache(SESSION_ID);
  }
})();

function showMain() {
  activeDashboardId = 'mainScreen';
  document.getElementById('loginScreen').style.display = 'none';
  var m = document.getElementById('mainScreen'); 
  m.style.display = 'flex'; 
  m.style.flexDirection = 'column'; 
  m.style.height = '100vh'; 
  m.style.width = '100vw'; 
  m.style.background = 'linear-gradient(180deg, #800000 0%, #6b1010 8%, #999999 40%, #b0b0b0 70%, #e2e6ed 100%)';
  updateClock(); 
  setInterval(updateClock, 1000); 
  loadEntries('main');
}

function showSuperAdmin() {
  activeDashboardId = 'superScreen';
  var loginScreen = document.getElementById('loginScreen');
  var mainScreen = document.getElementById('mainScreen');
  var adminScreen = document.getElementById('adminScreen');
  if (loginScreen) loginScreen.style.display = 'none';
  if (mainScreen) mainScreen.style.display = 'none';
  if (adminScreen) adminScreen.style.display = 'none';

  var m = document.getElementById('superScreen');
  if (!m) return;

  m.style.display = 'flex';
  m.style.flexDirection = 'column';
  m.style.height = '100vh';
  m.style.width = '100vw';

  m.style.background =
    'linear-gradient(180deg, #800000 0%, #6b1010 8%, #999999 40%, #b0b0b0 70%, #e2e6ed 100%)';

  updateClock();
  setInterval(updateClock, 1000);

  openCity(null, 'Leads');
  loadEntries('superadmin');
}

function showAdmin() {
  activeDashboardId = 'adminScreen';
  var loginScreen = document.getElementById('loginScreen');
  var mainScreen = document.getElementById('mainScreen');
  var superScreen = document.getElementById('superScreen');
  if (loginScreen) loginScreen.style.display = 'none';
  if (mainScreen) mainScreen.style.display = 'none';
  if (superScreen) superScreen.style.display = 'none';
  var m = document.getElementById('adminScreen'); 
  if (!m) return;
  m.style.display = 'flex'; 
  m.style.flexDirection = 'column'; 
  m.style.height = '100vh'; 
  m.style.width = '100vw'; 
  m.style.background = 'linear-gradient(180deg, #800000 0%, #6b1010 8%, #999999 40%, #b0b0b0 70%, #e2e6ed 100%)';
  updateClock(); 
  setInterval(updateClock, 1000); 
  openCity(null, 'Leads');
  loadEntries('admin');
}

function validateEmail() {

  var usernameInput = document.getElementById('username');
  var message = document.getElementById('message');

  if (!usernameInput || !message) {
    return;
  }

  var username = usernameInput.value.trim();
  if (!username.includes('@')) {
    message.textContent = 'Invalid email: @ is required';
    message.style.color = 'red';
  } else { message.textContent = 'Valid email'; message.style.color = 'green'; }
}

var usernameInput = document.getElementById('username');
if (usernameInput) {
  usernameInput.addEventListener('input', validateEmail);
}


function updateClock() { 
  var d = new Date(), el = dashboardElement('currentDate');
  if (el) el.textContent = d.toLocaleString('en-US', {timeZone: currentTimeZone, weekday:'long', year:'numeric', month:'long', day:'numeric', hour:'2-digit', minute:'2-digit'}); 
}

function populateUser() {
  if (!currentUser) return;
  var p = currentUser.name.split(' ').filter(Boolean), 
      ini = p.length > 1 ? (p[0][0]+p[p.length-1][0]).toUpperCase() : (p[0]||'').substring(0,2).toUpperCase();
  var avatar = dashboardElement('avatar');
  var userName = dashboardElement('userName');
  var userEmail = dashboardElement('userEmail');
  var userRole = dashboardElement('userRole');
  if (avatar) avatar.textContent = ini;
  if (userName) userName.textContent = currentUser.name;
  if (userEmail) userEmail.textContent = currentUser.email || '';
  if (userRole) userRole.textContent = currentUser.role || '';
}


function handleLogin(e) {

  e.preventDefault();

  var usernameEl =
    document.getElementById('username');

  var passwordEl =
    document.getElementById('password');

  var loginButton =
    document.getElementById('loginButton');

  var loginError =
    document.getElementById('loginError');

  if (!usernameEl || !passwordEl) { console.error('Login fields not found.'); return; }
  var u =
    usernameEl.value.trim();

  var p =
    passwordEl.value;

  if (loginError) { loginError.style.display = 'none'; }
  if (!u || !p) { if (loginError) { loginError.textContent = 'Please enter username and password.'; loginError.style.display = 'block'; } return; }
  if (loginButton) { loginButton.disabled = true; loginButton.textContent = 'Signing in...'; }

  google.script.run

    .withSuccessHandler(function(r) {
      if (loginButton) { loginButton.disabled = false; loginButton.textContent = 'Sign In'; }
      console.log('Login response:', r);

      if (!r || !r.success) { if (loginError) { loginError.textContent = r && r.message ? r.message : 'Login failed.'; loginError.style.display = 'block'; } return; }
      SESSION_ID =
        r.sessionId;

      sessionStorage.setItem(
        'crm_session',
        SESSION_ID
      );

      var role = normalizeRole(r.user && r.user.role ? r.user.role : '');

      currentUser = r.user;
      activeDashboardId = role === 'superadmin' ? 'superScreen' : role === 'admin' ? 'adminScreen' : 'mainScreen';

      console.log('Logged-in User:', currentUser);

      populateUser();

      console.log('User Role:', r.user.role);
      console.log('Normalized Role:', role);
      if (role === 'superadmin') { showSuperAdmin(); } else if (role === 'admin') { showAdmin(); } else { showMain(); } })

    .withFailureHandler(function(error) {

      console.error( 'loginUser() failed:', error );
      if (loginButton) { loginButton.disabled = false; loginButton.textContent = 'Sign In'; }
      if (loginError) { loginError.textContent = 'Unable to connect to server.'; loginError.style.display = 'block'; } }) .loginUser(u, p);
}

function handleLogout() {

  // Logout from server
  if (SESSION_ID) {
    google.script.run.logoutUser(SESSION_ID);
  }

  // Clear browser session
  sessionStorage.removeItem('crm_session');

  SESSION_ID = null;
  currentUser = null;

  // Hide all dashboard screens
  var mainScreen = document.getElementById('mainScreen');
  var adminScreen = document.getElementById('adminScreen');
  var superScreen = document.getElementById('superScreen');

  if (mainScreen) {
    mainScreen.style.display = 'none';
  }

  if (adminScreen) {
    adminScreen.style.display = 'none';
  }

  if (superScreen) {
    superScreen.style.display = 'none';
  }

  // Show login screen
  var loginScreen = document.getElementById('loginScreen');

  if (loginScreen) {
    loginScreen.style.display = 'block';
  }
}

function showToast(message, type) { 
  var toast = dashboardElement('toast');
  toast.textContent = message; 
  toast.className = 'toast ' + (type || 'success'); 
  toast.style.display = 'block'; 
  clearTimeout(toast._timeout); 
  toast._timeout = setTimeout(function() { toast.style.display = 'none'; }, 5000); 
}

function showConfirm(title, message, onConfirm, confirmColor) { 
  dashboardElement('confirmTitle').textContent = title || 'Confirm';
  dashboardElement('confirmMessage').innerHTML = message || 'Are you sure?';
  dashboardElement('confirmBtn').style.background = confirmColor || '#d32f2f';
  dashboardElement('confirmOverlay').style.display = 'flex';
  confirmCallback = onConfirm; 
}

function closeConfirm(confirmed) { 
  dashboardElement('confirmOverlay').style.display = 'none';
  if (confirmed && typeof confirmCallback === 'function') { 
    var cb = confirmCallback; confirmCallback = null; 
    cb(); 
  } 
}

// ========== ENTRY MODAL ==========
function openEntryModal() {
  dashboardElement('entryAuthorName').value = '';
  dashboardElement('entryEmail').value = '';
  dashboardElement('entryBook').value = '';
  dashboardElement('entryISBN').value = '';
  dashboardElement('entryAddress').value = '';
  dashboardElement('entryError').style.display = 'none';
  dashboardElement('phoneNumbersContainer').innerHTML = '<div style="display:flex;gap:8px;margin-bottom:8px;"><input type="text" class="entryPhone" placeholder="+1 234 567 8900" style="flex:1;padding:11px;border:1.5px solid #e0e0e0;border-radius:8px;font-size:14px;"><button type="button" onclick="removePhoneField(this)" style="background:#fee;color:#d32f2f;border:1px solid #fcc;border-radius:6px;cursor:pointer;font-size:12px;padding:0 10px;display:none;">Remove</button></div>';
  updateEntrySubmitButton(); 
  dashboardElement('addEntryModal').style.display = 'flex';
  dashboardElement('entryAuthorName').focus();
}

function closeEntryModal() { dashboardElement('addEntryModal').style.display = 'none'; }

function openUserModal() {
  ['userUsername', 'userPassword', 'userNameInput', 'userEmailInput'].forEach(function(id) {
    dashboardElement(id).value = '';
  });
  if (dashboardElement('userRoleInput')) dashboardElement('userRoleInput').value = 'Agent';
  if (dashboardElement('userStatusInput')) dashboardElement('userStatusInput').value = 'Active';
  if (dashboardElement('userPositionInput')) dashboardElement('userPositionInput').value = 'BM';
  updateUserPositionState();
  dashboardElement('userError').style.display = 'none';
  dashboardElement('addUserModal').style.display = 'flex';
  dashboardElement('userUsername').focus();
}

function closeUserModal() {
  dashboardElement('addUserModal').style.display = 'none';
}

function updateUserPositionState() {
  var role = dashboardElement('userRoleInput');
  var position = dashboardElement('userPositionInput');
  if (!role || !position) return;
  var isSuperAdmin = role.value === 'Super Admin';
  position.disabled = isSuperAdmin;
  if (isSuperAdmin) position.value = '';
  else if (!position.value) position.value = 'BM';
}

function updateUserPositionState() {
  var role = dashboardElement('userRoleInput');
  var position = dashboardElement('userPositionInput');

  if (!role || !position) return;

  var isRestrictedRole =
    role.value === 'Super Admin' ||
    role.value === 'Lead Gen Specialist';

  position.disabled = isRestrictedRole;

  if (isRestrictedRole) {
    position.value = '';
  } else if (!position.value) {
    position.value = 'BM';
  }
}


function submitUser(event) {
  event.preventDefault();
  var error = dashboardElement('userError');
  error.style.display = 'none';
  var userData = {
    username: dashboardElement('userUsername').value.trim(),
    password: dashboardElement('userPassword').value,
    name: dashboardElement('userNameInput').value.trim(),
    email: dashboardElement('userEmailInput').value.trim(),
    role: dashboardElement('userRoleInput').value,
    status: dashboardElement('userStatusInput') ? dashboardElement('userStatusInput').value : 'Active',
    position: dashboardElement('userPositionInput') && !dashboardElement('userPositionInput').disabled ? dashboardElement('userPositionInput').value : ''
  };
  google.script.run
    .withSuccessHandler(function(response) {
      if (response && response.success) {
        closeUserModal();
        showToast('User added.', 'success');
      } else {
        error.textContent = response && response.message ? response.message : 'Unable to add user.';
        error.style.display = 'block';
      }
    })
    .withFailureHandler(function() {
      error.textContent = 'Unable to connect to server.';
      error.style.display = 'block';
    })
    .addUser(SESSION_ID, userData);
}

function addPhoneField() { 
  var c = dashboardElement('phoneNumbersContainer'), d = document.createElement('div');
  d.style.cssText = 'display:flex;gap:8px;margin-bottom:8px;'; 
  d.innerHTML = '<input type="text" class="entryPhone" placeholder="+1 234 567 8900" style="flex:1;padding:11px;border:1.5px solid #e0e0e0;border-radius:8px;font-size:14px;"><button type="button" onclick="removePhoneField(this)" style="background:#fee;color:#d32f2f;border:1px solid #fcc;border-radius:6px;cursor:pointer;font-size:12px;padding:0 10px;">Remove</button>'; 
  c.appendChild(d); updateRemoveButtons(); 
}

function removePhoneField(b) { 
  var c = dashboardElement('phoneNumbersContainer');
  if (c.children.length > 1) { b.parentElement.remove(); updateRemoveButtons(); } 
}

function updateRemoveButtons() { 
  var rb = dashboardElement('phoneNumbersContainer').querySelectorAll('button');
  if (rb.length <= 1) rb.forEach(function(b) { b.style.display = 'none'; }); 
  else rb.forEach(function(b) { b.style.display = 'inline-block'; }); 
}

function updateEntrySubmitButton() { 
    var an = dashboardElement('entryAuthorName').value.trim(),
      bk = dashboardElement('entryBook').value.trim(),
      is = dashboardElement('entryISBN').value.trim();
    var b = dashboardElement('entrySubmitBtn');
  b.disabled = !(an && bk && is); 
  b.style.opacity = b.disabled ? '0.5' : '1'; 
}

function submitEntry(e) { 
  e.preventDefault(); 
  if (isSubmitting) return; 
  isSubmitting = true; 
    var an = dashboardElement('entryAuthorName').value.trim(),
      bk = dashboardElement('entryBook').value.trim(),
      is = dashboardElement('entryISBN').value.trim(),
      em = dashboardElement('entryEmail').value.trim(),
      ad = dashboardElement('entryAddress').value.trim();
    var dashboard = document.getElementById(activeDashboardId), pi = dashboard.querySelectorAll('.entryPhone'), ph = [];
  pi.forEach(function(i) { var v = i.value.trim(); if (v) ph.push(v); }); 
  var er = dashboardElement('entryError');
  er.style.display = 'none'; 
  if (!an || !bk || !is) { er.textContent = 'Author Name, Book, and ISBN are required.'; er.style.display = 'block'; isSubmitting = false; return; } 
  google.script.run.withSuccessHandler(function(r) { 
    isSubmitting = false; 
    if (r.success) { showToast('Entry saved!', 'success'); closeEntryModal(); loadEntries(); } 
    else { er.textContent = r.message; er.style.display = 'block'; } 
  }).addEntry(SESSION_ID, {authorName:an, phones:ph.join(', '), email:em, book:bk, isbn:is, address:ad}); 
}

var allEntries = [];
var allUsers = [];
var selectedUserId = null;
var selectedUserData = null;
var isUserEditMode = false;
var transferNotificationRequests = [];

function openCity(event, cityName) {
  var dashboard = document.getElementById(activeDashboardId);
  if (!dashboard) return;
  dashboard.querySelectorAll('.tabcontent').forEach(function(tab) { tab.style.display = 'none'; tab.classList.remove('is-active'); });
  dashboard.querySelectorAll('.tablinks').forEach(function(button) { button.classList.remove('active'); });
  var tab = dashboard.querySelector('#' + cityName);
  if (tab) { tab.style.display = 'flex'; tab.classList.add('is-active'); }
  if (event && event.currentTarget) event.currentTarget.classList.add('active');
  else {
    dashboard.querySelectorAll('.tablinks').forEach(function(button) {
      if (button.getAttribute('onclick') && button.getAttribute('onclick').indexOf("'" + cityName + "'") > -1) button.classList.add('active');
    });
  }
  var detail = dashboard.querySelector('#detailContent');
  var userDetail = dashboard.querySelector('#userDetailContent');
  var empty = dashboard.querySelector('#detailEmpty');
  if (cityName === 'Users') {
    if (detail) detail.style.display = 'none';
    if (userDetail) userDetail.style.display = selectedUserData ? 'flex' : 'none';
    if (empty) empty.style.display = selectedUserData ? 'none' : 'block';
    loadUsers();
  } else {
    if (userDetail) userDetail.style.display = 'none';
    if (detail) detail.style.display = selectedEntryData ? 'flex' : 'none';
    if (empty) empty.style.display = selectedEntryData ? 'none' : 'block';
  }
}

function loadUsers() {
  var tableBody = dashboardElement(activeDashboardId === 'superScreen' ? 'superUsersTableBody' : 'adminUsersTableBody');
  if (!tableBody || !SESSION_ID) return;
  tableBody.innerHTML = '<tr><td colspan="6" style="padding:60px;text-align:center;color:#aaa;">Loading users...</td></tr>';
  google.script.run.withSuccessHandler(function(response) {
    if (response && response.success) {
      allUsers = response.users || [];
      filterTable();
      if (selectedUserId !== null) selectUser(selectedUserId);
    } else {
      tableBody.innerHTML = '<tr><td colspan="6" style="padding:60px;text-align:center;color:#d32f2f;">Unable to load users.</td></tr>';
    }
  }).withFailureHandler(function() {
    tableBody.innerHTML = '<tr><td colspan="6" style="padding:60px;text-align:center;color:#d32f2f;">Unable to connect to server.</td></tr>';
  }).getUsers(SESSION_ID);
}

function renderUsers(users) {
  var tableBody = dashboardElement(activeDashboardId === 'superScreen' ? 'superUsersTableBody' : 'adminUsersTableBody');
  if (!tableBody) return;
  var countElement = dashboardElement(activeDashboardId === 'superScreen' ? 'superEntryCount' : 'entryCount');
  countElement.textContent = users.length + ' User' + (users.length !== 1 ? 's' : '');
  if (!users.length) {
    tableBody.innerHTML = '<tr><td colspan="6" style="padding:60px;text-align:center;color:#aaa;">No users found.</td></tr>';
    return;
  }
  var html = '';
  var userRowAction = '';
  users.forEach(function(user) {
    var statusColor = user.status === 'Active' ? '#2e7d32' : '#999';
    var statusBackground = user.status === 'Active' ? '#e8f5e9' : '#f5f5f5';
    var dashboard = document.getElementById(activeDashboardId);
    var canEditUsers = activeDashboardId === 'superScreen' || (dashboard && dashboard.querySelector('#userDetailContent'));
    userRowAction = canEditUsers ? ' onclick="selectUser(' + JSON.stringify(user.id) + ')"' : '';
    html += '<tr' + userRowAction + ' style="cursor:' + (canEditUsers ? 'pointer' : 'default') + ';border-bottom:1px solid #f0f0f0;" onmouseover="this.style.background=\'#f8f9fb\'" onmouseout="this.style.background=\'transparent\'">' +
      '<td style="padding:9px 12px;font-weight:500;text-align:center;">' + escapeHtml(user.name) + '</td>' +
      '<td style="padding:9px 12px;color:#555;text-align:center;">' + escapeHtml(user.email) + '</td>' +
      '<td style="padding:9px 12px;color:#555;text-align:center;">' + escapeHtml(user.position) + '</td>' +
      '<td style="padding:9px 12px;color:#555;text-align:center;">' + escapeHtml(user.role) + '</td>' +
      '<td style="padding:9px 12px;text-align:center;"><span style="display:inline-block;padding:3px 10px;border-radius:10px;font-size:10px;font-weight:600;color:' + statusColor + ';background:' + statusBackground + ';">' + escapeHtml(user.status || 'None') + '</span></td>' +
      '<td style="padding:9px 12px;color:#555;text-align:center;">' + escapeHtml(user.ip || '-') + '</td></tr>';
  });
  tableBody.innerHTML = html;
}

function selectUser(userId) {
  selectedUserData = null;
  for (var i = 0; i < allUsers.length; i++) {
    if (String(allUsers[i].id) === String(userId)) { selectedUserData = allUsers[i]; break; }
  }
  if (!selectedUserData) return;
  selectedUserId = selectedUserData.id;
  dashboardElement('detailEmpty').style.display = 'none';
  dashboardElement('detailContent').style.display = 'none';
  dashboardElement('userDetailContent').style.display = 'flex';
  setUserViewMode();
  ['Username','Name','Email','Position','Role','Status','Ip'].forEach(function(field) {
    var value = selectedUserData[field.toLowerCase()] || '-';
    dashboardElement('userDetail' + field + 'View').textContent = value;
    dashboardElement('userDetail' + field + 'Edit').value = selectedUserData[field.toLowerCase()] || '';
  });
  dashboardElement('userDetailPasswordEdit').value = '';
  updateUserEditPositionState();
  updateUserStatusBadge(selectedUserData.status);
}

function setUserViewMode() {
  ['userDetailUsernameView','userDetailNameView','userDetailEmailView','userDetailPositionView','userDetailRoleView','userDetailStatusView','userDetailIpView'].forEach(function(id) { dashboardElement(id).style.display = 'block'; });
  ['userDetailUsernameEdit','userDetailNameEdit','userDetailEmailEdit','userDetailPositionEdit','userDetailRoleEdit','userDetailStatusEdit','userDetailIpEdit','userDetailPasswordEdit'].forEach(function(id) { dashboardElement(id).style.display = 'none'; });
  dashboardElement('userEditBtn').style.display = 'inline-block';
  dashboardElement('userSaveEditBtn').style.display = 'none';
  dashboardElement('userCancelEditBtn').style.display = 'none';
  dashboardElement('userDetailPositionEdit').disabled = false;
  isUserEditMode = false;
}

function updateUserEditPositionState() {
  var role = dashboardElement('userDetailRoleEdit');
  var position = dashboardElement('userDetailPositionEdit');
  if (!role || !position) return;
  var isSuperAdmin = role.value === 'Super Admin';
  position.disabled = isSuperAdmin;
  if (isSuperAdmin) position.value = '';
}

function toggleUserEditMode() {
  ['userDetailUsernameView','userDetailNameView','userDetailEmailView','userDetailPositionView','userDetailRoleView','userDetailStatusView','userDetailIpView'].forEach(function(id) { dashboardElement(id).style.display = 'none'; });
  ['userDetailUsernameEdit','userDetailNameEdit','userDetailEmailEdit','userDetailPositionEdit','userDetailRoleEdit','userDetailStatusEdit','userDetailIpEdit','userDetailPasswordEdit'].forEach(function(id) { dashboardElement(id).style.display = 'block'; });
  dashboardElement('userEditBtn').style.display = 'none';
  dashboardElement('userSaveEditBtn').style.display = 'inline-block';
  dashboardElement('userCancelEditBtn').style.display = 'inline-block';
  updateUserEditPositionState();
  isUserEditMode = true;
}

function cancelUserEdit() { selectUser(selectedUserId); }

function saveUserEdits() {
  if (!selectedUserId) return;
  google.script.run.withSuccessHandler(function(response) {
    if (response && response.success) {
      showToast('User updated.', 'success');
      loadUsers();
      setUserViewMode();
    } else showToast(response && response.message ? response.message : 'Unable to update user.', 'error');
  }).withFailureHandler(function() { showToast('Unable to connect to server.', 'error'); }).updateUser(SESSION_ID, selectedUserId, {
    username: dashboardElement('userDetailUsernameEdit').value.trim(),
    name: dashboardElement('userDetailNameEdit').value.trim(),
    email: dashboardElement('userDetailEmailEdit').value.trim(),
    position: dashboardElement('userDetailPositionEdit').value,
    role: dashboardElement('userDetailRoleEdit').value,
    status: dashboardElement('userDetailStatusEdit').value,
    ip: dashboardElement('userDetailIpEdit').value.trim(),
    password: dashboardElement('userDetailPasswordEdit').value
  });
}

function deleteCurrentUser() {
  if (!selectedUserId || !selectedUserData) return;
  showConfirm('Delete User', 'Delete ' + escapeHtml(selectedUserData.name || selectedUserData.username) + '?', function() {
    google.script.run.withSuccessHandler(function(response) {
      if (response && response.success) {
        selectedUserId = null;
        selectedUserData = null;
        dashboardElement('userDetailContent').style.display = 'none';
        dashboardElement('detailEmpty').style.display = 'block';
        loadUsers();
        showToast('User deleted.', 'success');
      } else showToast(response && response.message ? response.message : 'Unable to delete user.', 'error');
    }).withFailureHandler(function() { showToast('Unable to connect to server.', 'error'); }).deleteUser(SESSION_ID, selectedUserId);
  });
}

function updateUserStatusBadge(status) {
  var badge = dashboardElement('userDetailStatus');
  badge.textContent = status || 'None';
  badge.style.color = status === 'Active' ? '#2e7d32' : '#999';
  badge.style.background = status === 'Active' ? '#e8f5e9' : '#f5f5f5';
}
var columnFilters = {};

function loadEntries(scope) {
  scope = scope || (activeDashboardId === 'mainScreen' ? 'main' : activeDashboardId === 'superScreen' ? 'superadmin' : 'admin');
  if (!SESSION_ID) return;
  var tableBody = dashboardElement(scope === 'superadmin' ? 'superEntriesTableBody' : 'entriesTableBody');
  tableBody.innerHTML = '<tr><td colspan="5" style="padding:60px;text-align:center;color:#aaa;">Loading...</td></tr>';
  var handleResponse = function(r) {
    if (r && r.success) {
      allEntries = r.entries || [];
      buildFilterOptions();
      filterTable();
      updateSummaryCards(r.summary || {});
    } else {
      tableBody.innerHTML = '<tr><td colspan="5" style="padding:60px;text-align:center;color:#d32f2f;">Unable to load entries.</td></tr>';
    }
  };
  var request = google.script.run
    .withSuccessHandler(handleResponse)
    .withFailureHandler(function() {
      tableBody.innerHTML = '<tr><td colspan="5" style="padding:60px;text-align:center;color:#d32f2f;">Unable to connect to server.</td></tr>';
    });
  if (scope === 'main') request.getEntriesForAgent(SESSION_ID);
  else request.getEntries(SESSION_ID);
}

function renderTable(entries) { 
  var tb = dashboardElement(activeDashboardId === 'superScreen' ? 'superEntriesTableBody' : 'entriesTableBody');
  dashboardElement(activeDashboardId === 'superScreen' ? 'superEntryCount' : 'entryCount').textContent = entries.length + ' Entr' + (entries.length !== 1 ? 'ies' : 'y');
  if (!entries.length) { tb.innerHTML = '<tr><td colspan="5" style="padding:60px;text-align:center;color:#aaa;">No entries found.</td></tr>'; return; } 
  var h = ''; 
  entries.forEach(function(e) { 
    var sc, sb;
    if (!e.status || e.status === '') { sc = '#999'; sb = '#f5f5f5'; }
    else if (e.status === 'Sold') { sc = '#2e7d32'; sb = '#e8f5e9'; }
    else if (e.status === 'DNC') { sc = '#c62828'; sb = '#ffebee'; }
    else if (e.status === 'VM') { sc = '#c2185b'; sb = '#fce4ec'; }
    else { sc = '#e67e22'; sb = '#fff3e0'; }
    h += '<tr onclick="selectEntry('+e.id+')" style="cursor:pointer;border-bottom:1px solid #f0f0f0;" onmouseover="this.style.background=\'#f8f9fb\'" onmouseout="this.style.background=\'transparent\'">' +
      '<td style="padding:9px 12px;font-weight:500;text-align:center;">'+escapeHtml(e.authorName)+'</td>' +
      '<td style="padding:9px 12px;color:#555;text-align:center;">'+escapeHtml(e.book)+'</td>' +
      '<td style="padding:9px 12px;color:#555;text-align:center;">'+escapeHtml(e.isbn)+'</td>' +
      '<td style="padding:9px 12px;color:#555;text-align:center;">'+(escapeHtml(e.assignedAgentName)||'<span style="color:#999;">Unassigned</span>')+'</td>' +
      '<td style="padding:9px 12px;text-align:center;"><span style="display:inline-block;padding:3px 10px;border-radius:10px;font-size:10px;font-weight:600;color:'+sc+';background:'+sb+';">'+(e.status||'None')+'</span></td></tr>'; 
  }); 
  tb.innerHTML = h; 
}

function getFilteredEntries() { 
  var f = allEntries.slice(); 
  var st = dashboardElement(activeDashboardId === 'superScreen' ? 'superSearchInput' : 'searchInput').value.trim().toLowerCase();
  if (st) f = f.filter(function(e) { return (e.authorName&&e.authorName.toLowerCase().indexOf(st)>-1)||(e.book&&e.book.toLowerCase().indexOf(st)>-1)||(e.isbn&&e.isbn.toLowerCase().indexOf(st)>-1)||(e.assignedAgentName&&e.assignedAgentName.toLowerCase().indexOf(st)>-1)||(e.status&&e.status.toLowerCase().indexOf(st)>-1); }); 
  for (var field in columnFilters) { if (columnFilters[field] && columnFilters[field].length > 0) f = f.filter(function(e) { var v = ''; switch(field) { case 'author': v=e.authorName; break; case 'book': v=e.book; break; case 'agent': v=e.assignedAgentName; break; case 'status': v=e.status; break; } return columnFilters[field].indexOf(v) > -1; }); } 
  if (activeStatusFilter) f = f.filter(function(e) { return e.status === activeStatusFilter; }); 
  return f; 
}


function filterTable() {
  var dashboard = document.getElementById(activeDashboardId);
  var usersTab = dashboard && dashboard.querySelector('#Users');
  if (usersTab && usersTab.style.display !== 'none') {
    var searchInput = dashboardElement(activeDashboardId === 'superScreen' ? 'superSearchInput' : 'searchInput');
    var search = searchInput ? searchInput.value.trim().toLowerCase() : '';
    var filteredUsers = allUsers.filter(function(user) {
      return !search || [user.name, user.email, user.position, user.role, user.status, user.ip].some(function(value) {
        return value && value.toString().toLowerCase().indexOf(search) > -1;
      });
    });
    renderUsers(filteredUsers);
    return;
  }
  renderTable(getFilteredEntries());
}

function buildFilterOptions() { 
  ['author','book','status'].forEach(function(field) { 
    var dashboard = document.getElementById(activeDashboardId);
    var lc = dashboard && dashboard.querySelector('#filterDropdown-'+field+' .filter-options-list');
    if (!lc) return; 
    var vals = {}; 
    allEntries.forEach(function(e) { var v = ''; switch(field){case'author':v=e.authorName;break;case'book':v=e.book;break;case'status':v=e.status;break;} if(v)vals[v]=(vals[v]||0)+1; }); 
    var sv = Object.keys(vals).sort(); 
    var h = ''; 
    sv.forEach(function(val) { var is = columnFilters[field] && columnFilters[field].indexOf(val) > -1; h += '<div onclick="return toggleColumnFilter(\''+field+'\', \''+escapeHtml(val).replace(/'/g,"\\'")+'\', event)" style="padding:8px 14px;cursor:pointer;font-size:12px;display:flex;align-items:center;gap:8px;" onmouseover="this.style.background=\'#f8f9fb\'" onmouseout="this.style.background=\'transparent\'"><input type="checkbox" '+(is?'checked':'')+' style="pointer-events:none;"><span>'+escapeHtml(val)+'</span><span style="color:#aaa;font-size:11px;">'+vals[val]+'</span></div>'; }); 
    lc.innerHTML = h; 
  }); 
}

function toggleFilterDropdown(event, field) { 
  event.preventDefault(); event.stopPropagation(); 
  var dd = dashboardElement('filterDropdown-'+field);
  var dashboard = document.getElementById(activeDashboardId);
  if (!dd || !dashboard) return false;
  dashboard.querySelectorAll('.dropdown-content').forEach(function(d){d.style.display='none';});
  dd.style.display = dd.style.display === 'block' ? 'none' : 'block'; 
  if (dd.style.display === 'block') buildFilterOptions(); 
  return false; 
}

function filterDropdownOptions(input, field) { 
  var st = input.value.toLowerCase(); 
  var dashboard = document.getElementById(activeDashboardId);
  if (dashboard) dashboard.querySelectorAll('#filterDropdown-'+field+' .filter-options-list div').forEach(function(o) { o.style.display = o.textContent.toLowerCase().indexOf(st) > -1 ? 'flex' : 'none'; });
}

function toggleColumnFilter(field, value, event) { 
  if (event) { event.preventDefault(); event.stopPropagation(); } 
  if (!columnFilters[field]) columnFilters[field] = []; 
  var i = columnFilters[field].indexOf(value); 
  if (i > -1) columnFilters[field].splice(i, 1); 
  else columnFilters[field].push(value); 
  filterTable(); 
  return false; 
}

document.addEventListener('click', function(event) { 
  if (!event.target.closest('#notif')) {
    var notification = dashboardElement('notif');
    if (notification) {
      notification.classList.remove('is-open');
      notification.setAttribute('aria-expanded', 'false');
    }
  }
  if (!event.target.closest('.settings')) {
    var settingsCard = dashboardElement('settingsCard');
    var settingsButton = document.getElementById(activeDashboardId) && document.getElementById(activeDashboardId).querySelector('.setting-icon');
    if (settingsCard) settingsCard.classList.remove('is-open');
    if (settingsButton) settingsButton.setAttribute('aria-expanded', 'false');
  }
  if (!event.target.closest('.dropdown-content') && !event.target.closest('.filter-btn')) { 
    var dashboard = document.getElementById(activeDashboardId);
    if (dashboard) dashboard.querySelectorAll('.dropdown-content').forEach(function(d){d.style.display='none';});
  } 
});

function toggleSettings(event) {
  event.stopPropagation();
  var settingsCard = dashboardElement('settingsCard');
  var settingsButton = event.currentTarget;
  if (!settingsCard) return;
  var isOpen = settingsCard.classList.toggle('is-open');
  settingsButton.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
}

function toggleNotifications(event) {
  if (event) {
    event.preventDefault();
    event.stopPropagation();
  }
  var notification = dashboardElement('notif');
  if (!notification) return;
  var isOpen = notification.classList.toggle('is-open');
  notification.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
  if (isOpen) loadTransferRequestNotifications();
}

function updateSummaryCards(s) { 
  dashboardElement('totalCount').textContent = s.totalAssigned || 0;
  dashboardElement('pipeCount').textContent = s.pipeCount || 0;
  dashboardElement('soldCount').textContent = s.soldCount || 0;
  ['pending', 'vm', 'dnc', 'exclusive', 'delete'].forEach(function(status) {
    var count = dashboardElement(status + 'Count');
    if (count) count.textContent = s[status + 'Count'] || 0;
  });
  updateNotifications(s.pendingCount || 0);
}

function updateNotifications(count) {
  var notification = dashboardElement('notif');
  if (!notification) return;
  var badge = notification.querySelector('.notif-count');
  var text = notification.querySelector('.notif-text');
  var notificationCount = Number(count) || 0;
  badge.textContent = notificationCount > 99 ? '99+' : notificationCount;
  text.textContent = notificationCount ? notificationCount + ' pending lead' + (notificationCount === 1 ? '' : 's') : 'No new notifications';
  loadTransferRequestNotifications();
}

function loadTransferRequestNotifications() {
  if ((activeDashboardId !== 'superScreen' && activeDashboardId !== 'adminScreen') || !SESSION_ID) return;
  google.script.run.withSuccessHandler(function(response) {
    if (!response || !response.success) return;
    var notification = dashboardElement('notif');
    if (!notification) return;
    var badge = notification.querySelector('.notif-count');
    var text = notification.querySelector('.notif-text');
    var requests = response.requests || [];
    transferNotificationRequests = requests;
    badge.textContent = response.count > 99 ? '99+' : response.count;
    text.innerHTML = requests.length ? requests.map(function(request) {
      return '<button type="button" class="notif-request" onclick="selectTransferRequest(event, ' + requests.indexOf(request) + ')">Request Transfer From ' + escapeHtml(request.agentName) + '</button>';
    }).join('') : 'No new notifications';
  }).getTransferRequestNotifications(SESSION_ID);
}

function selectTransferRequest(event, requestIndex) {
  if (event) {
    event.preventDefault();
    event.stopPropagation();
  }
  var request = transferNotificationRequests[requestIndex];
  if (!request) return;
  openTransferReviewModal(request);
}

function openTransferReviewModal(request) {
  var modal = dashboardElement('transferReviewModal');
  if (!modal) return;
  dashboardElement('transferReviewAgent').textContent = request.agentName || 'Unknown Agent';
  dashboardElement('transferReviewDecision').value = 'Approve';
  dashboardElement('transferReviewNote').value = '';
  modal.style.display = 'flex';
  modal.dataset.rowNumber = request.rowNumber;
}

function closeTransferReviewModal() {
  var modal = dashboardElement('transferReviewModal');
  if (modal) modal.style.display = 'none';
}

function submitTransferReview(event) {
  event.preventDefault();
  var modal = dashboardElement('transferReviewModal');
  var rowNumber = modal && modal.dataset.rowNumber;
  var decision = dashboardElement('transferReviewDecision').value;
  var note = dashboardElement('transferReviewNote').value.trim();
  google.script.run.withSuccessHandler(function(response) {
    if (response && response.success) {
      closeTransferReviewModal();
      loadTransferRequestNotifications();
      showToast('Transfer request reviewed.', 'success');
    } else showToast(response && response.message ? response.message : 'Unable to review transfer request.', 'error');
  }).withFailureHandler(function() { showToast('Unable to connect to server.', 'error'); }).reviewTransferRequest(SESSION_ID, rowNumber, decision, note);
}

function refreshTransferNotifications(event) {
  if (event) {
    event.preventDefault();
    event.stopPropagation();
  }
  loadTransferRequestNotifications();
}



function filterByStatus(status) { 
  activeStatusFilter = activeStatusFilter === status ? null : status; 
  filterTable(); 
}

// ========== DETAIL PANEL ==========
var selectedEntryId = null; 
var selectedEntryData = null; 
var isEditMode = false;

function selectEntry(entryId) {
  var numEntryId = Number(entryId);
  selectedEntryData = null; 
  for (var i = 0; i < allEntries.length; i++) { if (allEntries[i].id == numEntryId) { selectedEntryData = allEntries[i]; break; } }
  if (!selectedEntryData) return; 
  selectedEntryId = numEntryId; 
  isEditMode = false;
  dashboardElement('detailEmpty').style.display = 'none';
  dashboardElement('detailContent').style.display = 'flex';
  dashboardElement('userDetailContent').style.display = 'none';
  setViewMode();
  dashboardElement('detailAuthorNameView').textContent = selectedEntryData.authorName || '-';
  dashboardElement('detailPhonesView').textContent = selectedEntryData.phones || '-';
  dashboardElement('detailEmailView').textContent = selectedEntryData.email || '';
  dashboardElement('detailBookView').textContent = selectedEntryData.book || '-';
  dashboardElement('detailISBNView').textContent = selectedEntryData.isbn || '-';
  dashboardElement('detailAddressView').textContent = selectedEntryData.address || '-';
  dashboardElement('detailAuthorNameEdit').value = selectedEntryData.authorName || '';
  dashboardElement('detailPhonesEdit').value = selectedEntryData.phones || '';
  dashboardElement('detailEmailEdit').value = selectedEntryData.email || '';
  dashboardElement('detailBookEdit').value = selectedEntryData.book || '';
  dashboardElement('detailISBNEdit').value = selectedEntryData.isbn || '';
  dashboardElement('detailAddressEdit').value = selectedEntryData.address || '';
  dashboardElement('detailStatusSelect').value = selectedEntryData.status || '';
  updateStatusBadge(selectedEntryData.status);
  showingAllActivity = false; 
  dashboardElement('toggleActivityBtn').textContent = 'Show All Activity';
  loadRemarksOnly();
  dashboardElement('remarkInput').value = '';
}

function setViewMode() { 
  dashboardElement('editBtn').style.display = 'inline-block';
  dashboardElement('saveEditBtn').style.display = 'none';
  dashboardElement('cancelEditBtn').style.display = 'none';
  ['detailAuthorNameView','detailPhonesView','detailEmailView','detailBookView','detailISBNView','detailAddressView'].forEach(function(id){dashboardElement(id).style.display='block';});
  ['detailAuthorNameEdit','detailPhonesEdit','detailEmailEdit','detailBookEdit','detailISBNEdit','detailAddressEdit'].forEach(function(id){dashboardElement(id).style.display='none';});
  isEditMode = false; 
}

function toggleEditMode() { 
  dashboardElement('editBtn').style.display = 'none';
  dashboardElement('saveEditBtn').style.display = 'inline-block';
  dashboardElement('cancelEditBtn').style.display = 'inline-block';
  ['detailAuthorNameView','detailPhonesView','detailEmailView','detailBookView','detailISBNView','detailAddressView'].forEach(function(id){dashboardElement(id).style.display='none';});
  ['detailAuthorNameEdit','detailPhonesEdit','detailEmailEdit','detailBookEdit','detailISBNEdit','detailAddressEdit'].forEach(function(id){dashboardElement(id).style.display='block';});
  isEditMode = true; 
}

function cancelEdit() { setViewMode(); }

function saveEntryEdits() { 
  if (!selectedEntryId) return; 
  google.script.run.withSuccessHandler(function(r) { 
    if (r.success) { showToast('Updated!', 'success'); setViewMode(); selectEntry(selectedEntryId); loadEntries(); } 
    else { showToast(r.message, 'error'); } 
  }).updateEntry(SESSION_ID, selectedEntryId, {
    authorName: dashboardElement('detailAuthorNameEdit').value.trim(),
    phones: dashboardElement('detailPhonesEdit').value.trim(),
    email: dashboardElement('detailEmailEdit').value.trim(),
    book: dashboardElement('detailBookEdit').value.trim(),
    isbn: dashboardElement('detailISBNEdit').value.trim(),
    address: dashboardElement('detailAddressEdit').value.trim()
  }); 
}

function deleteCurrentEntry() { 
  showConfirm('Delete', 'Delete this entry?', function() { 
    google.script.run.withSuccessHandler(function(r) { 
      if (r.success) { showToast('Deleted.', 'success'); loadEntries(); dashboardElement('detailEmpty').style.display = 'block'; dashboardElement('detailContent').style.display = 'none'; }
      else { showToast(r.message, 'error'); } 
    }).deleteEntry(SESSION_ID, selectedEntryId); 
  }, '#d32f2f'); 
}

function changeEntryStatus() { 
  google.script.run.withSuccessHandler(function(r) { 
    if (r.success) { updateStatusBadge(dashboardElement('detailStatusSelect').value); showToast('Updated!', 'success'); loadEntries(); }
  }).updateEntryStatus(SESSION_ID, selectedEntryId, dashboardElement('detailStatusSelect').value);
}


function updateStatusBadge(status) { 
  var b = dashboardElement('detailStatus');
  if (!status || status === '') { b.style.background = '#f5f5f5'; b.style.color = '#999'; b.textContent = 'None'; } 
  else if (status === 'Sold') { b.style.background = '#e8f5e9'; b.style.color = '#2e7d32'; } 
  else if (status === 'DNC') { b.style.background = '#ffebee'; b.style.color = '#c62828'; } 
  else if (status === 'VM') { b.style.background = '#fce4ec'; b.style.color = '#c2185b'; } 
  else { b.style.background = '#fff3e0'; b.style.color = '#e67e22'; } 
  b.textContent = status || 'None'; 

}

// ========== REMARKS & ACTIVITY ==========
function toggleActivityView() { 
  if (showingAllActivity) { showingAllActivity = false; dashboardElement('toggleActivityBtn').textContent = 'Show All Activity'; loadRemarksOnly(); }
  else { showingAllActivity = true; dashboardElement('toggleActivityBtn').textContent = 'Show Remarks Only'; loadEntryActivity(); }
}

function loadRemarksOnly() { 
  if (!selectedEntryId) return; 
  google.script.run.withSuccessHandler(function(remarks) { 
    var c = dashboardElement('remarksList');
    if (!remarks || remarks.length === 0) { c.innerHTML = '<div style="color:#b8a88a;font-size:12px;text-align:center;padding:20px;">No remarks yet.</div>'; return; } 
    var h = ''; 
    remarks.forEach(function(r) { 
      var t = new Date(r.timestamp); 
      h += '<div style="background:white;border-radius:8px;padding:10px;margin-bottom:8px;border:1px solid #e8dcc8;"><div style="display:flex;justify-content:space-between;"><span style="font-size:11px;font-weight:600;color:#5d4e37;">'+escapeHtml(r.userName)+'</span><span style="font-size:9px;color:#b8a88a;">'+t.toLocaleString()+'</span></div><div style="font-size:12px;color:#3d3223;">'+escapeHtml(r.remark)+'</div></div>'; 
    }); 
    c.innerHTML = h; 
  }).getRemarks(selectedEntryId); 
}

function loadEntryActivity() { 
  if (!selectedEntryId) return; 
  google.script.run.withSuccessHandler(function(items) { 
    var c = dashboardElement('remarksList');
    if (!items || items.length === 0) { c.innerHTML = '<div style="color:#b8a88a;font-size:12px;text-align:center;padding:20px;">No activity yet.</div>'; return; } 
    var h = ''; 
    items.forEach(function(item) { 
      var t = new Date(item.timestamp); 
      var bg = item.type === 'activity' ? '#f0f4f8' : 'white'; 
      h += '<div style="background:'+bg+';border-radius:8px;padding:10px;margin-bottom:8px;border:1px solid '+(item.type==='activity'?'#c8d6e5':'#e8dcc8')+';"><div style="display:flex;justify-content:space-between;"><span style="font-size:11px;font-weight:600;color:#5d4e37;">'+escapeHtml(item.userName)+'</span><span style="font-size:9px;color:#b8a88a;">'+t.toLocaleString()+'</span></div><div style="font-size:12px;color:#3d3223;">'+item.content+'</div></div>'; 
    }); 
    c.innerHTML = h; 
  }).getEntryActivity(selectedEntryId); 
}

function addRemark() { 
  var txt = dashboardElement('remarkInput').value.trim();
  if (!txt) return; 
  google.script.run.withSuccessHandler(function(r) { 
    if (r.success) { dashboardElement('remarkInput').value = ''; if (showingAllActivity) loadEntryActivity(); else loadRemarksOnly(); }
  }).addRemark(SESSION_ID, selectedEntryId, txt); 
}

function escapeHtml(t) { if (!t) return ''; var d = document.createElement('div'); d.textContent = t; return d.innerHTML; }

// ========== EVENT LISTENERS ==========
document.addEventListener('keydown', function(e) { 
  if (e.key === 'Enter' && document.activeElement === document.getElementById('remarkInput')) { e.preventDefault(); addRemark(); } 
  if (e.key === 'Escape') { closeEntryModal(); closeConfirm(false); } 
});

document.addEventListener('DOMContentLoaded', function() {
  document.querySelectorAll('.confirm-overlay #confirmBtn').forEach(function(button) {
    button.addEventListener('click', function() { closeConfirm(true); });
  });
  document.querySelectorAll('.confirm-overlay').forEach(function(overlay) {
    overlay.addEventListener('click', function(e) { if (e.target === overlay && overlay.id === 'confirmOverlay') closeConfirm(false); });
  });
  //document.getElementById('addEntryModal').addEventListener('click', function(e) { if (e.target === document.getElementById('addEntryModal')) closeEntryModal(); });
  ['entryAuthorName','entryBook','entryISBN'].forEach(function(id) { 
    var el = document.getElementById(id); if (el) el.addEventListener('input', updateEntrySubmitButton); 
  });
});
</script>
